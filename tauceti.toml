# Canonical, human-owned project configuration. No credentials belong here.
schema_version = 1

[project]
name = "TauCeti"
branch = "main"
codeowners = ["@TauCetiProject/humans"]

[repositories]
content = "TauCetiProject/TauCeti"
roadmap = "TauCetiProject/TauCetiRoadmap"
review = "TauCetiProject/TauCetiReview"
# Enable and create these repositories when choosing the corresponding extras.
data = "TauCetiProject/TauCetiData"
ci = "TauCetiProject/TauCetiCI"
claims = "TauCetiProject/tauceti-claims"

[lean]
roots = ["TauCeti"]
root_module = "empty"

[roadmap]
active_dir = "TauCetiRoadmap"
completed_dir = "Completed"

# Select full commit SHAs before installing the core workflows.
# Discover a version with: gh api repos/TauCetiProject/TauCetiTools/commits/main --jq .sha

[merge]
backend = "bors"
checks = ["build", "bump-guard", "scope"]

[[upstreams]]
repo = "leanprover-community/mathlib4"
package = "mathlib"
branch = "master"
update = true
overlap = true
upstream_destination = true

# Everything below is optional. Run doctor --extras to continue beyond core.
[features]
archives = true
ci_archive = true
claims = true
docs = true
progress = true
zulip = true
fleet = true
security_audit = true

[services.github_state]
mode = "hosted"
url = "https://github-state.taucetiproject.org" # off | hosted | custom

[services.bors]
mode = "hosted"
url = "https://bors.taucetiproject.org"
repository_id = 1 # hosted supplies Neon only; YOU operate the runtime
deployment = "cloudflare"

# Shared machine ceilings apply across both job classes. The Namespace ceiling
# counts queued/running builds; simultaneous picker decisions can exceed it briefly.
[services.fleet]
mode = "hosted"
url = "https://fleet.taucetiproject.org"
namespace_build_cap = 20
pr_order = ["github", "chris", "tauchonki", "namespace"]
staging_order = ["tauchonki", "chris", "namespace", "github"]

[services.fleet.machines.chris]
enrollment_name = "chris-server"
max_jobs = 2
kinds = ["pr", "staging"]

[services.fleet.machines.tauchonki]
machine_id = "11e2756fc11042d798f759410573a935"
max_jobs = 1
kinds = ["staging"]

[services.cache]
mode = "hosted"
name = "tauceti-public"
domain = "cache.taucetiproject.org"
artifact_url = "https://cache.taucetiproject.org/artifacts"
revision_url = "https://cache.taucetiproject.org/revisions"

artifact_write_url = "https://ec2169bdf033f56b009956d4b64ba8ef.r2.cloudflarestorage.com/tauceti-cache/artifacts"

revision_write_url = "https://ec2169bdf033f56b009956d4b64ba8ef.r2.cloudflarestorage.com/tauceti-cache/revisions"

[publication]
docs_url = "https://taucetiproject.github.io/TauCeti/docs"
zulip_site = "https://leanprover.zulipchat.com"
zulip_channel = "Tau Ceti"
zulip_topic = "Progress logs"

[tools.tools]
repo="TauCetiProject/TauCetiTools"
ref="0f4096297f058bff8ccd873067aab7120202aecf"
[tools.review]
repo="TauCetiProject/TauCetiReview"
ref="14d5db7642210a3cec00059feb33ac33a45daa5d"
[tools.progress]
repo="TauCetiProject/TauCetiProgress"
ref="047029660478ea2af4ad8cdfe0c88db0d5d1ca29"
