name: Roadmap label

# Label every PR with its declared primary roadmap association. New PRs carry a
# standalone `Roadmap: <Area-or-none>` line; target markers and canonical roadmap
# citations remain compatibility fallbacks for older descriptions.
#
#   roadmap/<Area>   exactly one canonical association
#   roadmap/none     the diff reaches outside the AI-ownable path set (infra, merged by
#                    human override), is a pin-only bump, or explicitly declares none
#   roadmap/Unknown  missing, invalid, or conflicting association
#
# The area label is created on first use, so a roadmap added in TauCetiRoadmap becomes
# labelable with no change here.
#
# Runs on pull_request_target so it can label PRs from forks, but it NEVER checks out or
# executes PR head code: it reads only PR metadata (title/body/files) through the API and
# runs the trusted base-branch script. The body is untrusted, so it is only ever
# parsed against the fixed set of canonical roadmap names and never interpolated into
# a shell; the label applied always comes from a closed set.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Coalesce the burst of edited/synchronize events on a single PR.
concurrency:
  # Ignored title edits must not cancel a body/push run before the job's if is evaluated.
  group: ${{ (github.event.action == 'edited' && github.event.changes.body == null && github.event.changes.base == null) && format('roadmap-label-ignored-{0}', github.run_id) || format('roadmap-label-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label:
    # Title-only edits do not affect attribution or the structure nudge.
    if: github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Let rapid pushes/body edits collapse before minting a token or fetching API data.
      - name: Coalesce events
        run: sleep 20

      # pull_request_target can grant write permissions even for fork PRs. The App
      # is retained for mutations because its label/comment events trigger pr-status
      # and other downstream workflows; GITHUB_TOKEN mutations suppress those events.
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write  # also posts the unknown-roadmap nudge

      # The base checkout (trusted): the classifier that runs is the one on the target
      # branch, not the version proposed by the PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The roadmap repo supplies the canonical area set (the source of truth for which
      # roadmap/<Area> labels are legitimate).
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@ad4e955b398d1419b0931e3c825a925f1c6a6e9b
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: ad4e955b398d1419b0931e3c825a925f1c6a6e9b
          project-directory: .
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiRoadmap
          ref: main
          path: roadmap
          persist-credentials: false

      # The classifier passes its validated PR snapshot directly to the advisory
      # structure nudge. Advisory errors remain warnings; label failures stay visible
      # and are repaired by roadmap-label-reconcile.yml.
      - name: Classify, label, and nudge
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/roadmap_label.py \
            --repo "$REPO" --roadmap-dir roadmap --pr "$PR" --apply --structure-nudge
