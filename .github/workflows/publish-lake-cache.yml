name: publish-lake-cache

# Secret-isolated Lake cache publisher shared by main CI and merge-group CI. The caller may
# execute arbitrary Lean code while producing the staging artifact, so this workflow treats the
# entire artifact and every reported value as hostile. It checks out only the toolchain pin and
# the public-map helper at the immutable revision being published. The helper remains inert until
# the key-bearing upload step has exited; no project or dependency code runs while LAKE_CACHE_KEY
# is present.

on:
  workflow_call:
    inputs:
      revision:
        description: Immutable TauCeti revision whose output map is being published
        required: true
        type: string
      artifact-name:
        description: Name of the staging artifact produced by the caller
        required: true
        type: string
      reported-toolchain:
        description: Toolchain used by the staging build (cross-checked against the revision)
        required: true
        type: string
      publication-required:
        description: Fail rather than skip if cache upload configuration is absent
        required: false
        default: false
        type: boolean
    outputs:
      published:
        description: Whether the revision map was uploaded and observed on the public endpoint
        value: ${{ jobs.publish.outputs.published }}
    secrets:
      LAKE_CACHE_KEY:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      # Exactly two repository files are admitted. Which toolchain this job installs decides
      # which `lake` handles the upload key, so the pin is read independently from the immutable
      # revision rather than trusted from the staging build. The Python helper is present only so
      # a later, key-free step can share the public URL contract with every other cache probe; it
      # is data, never executed, before or during the secret-bearing upload step.
      - name: Check out the toolchain pin and key-free confirmation helper
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          sparse-checkout: |
            lean-toolchain
            scripts/lake_cache_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the staged oleans
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/lake-cache-staging

      - name: Check the staged tree before pointing Lake at it
        env:
          STAGING: ${{ runner.temp }}/lake-cache-staging
        run: |
          set -euo pipefail
          # `lake cache put-staged` joins artifact names from outputs.jsonl to STAGING. The
          # producer ran arbitrary Lean code, so reject nesting, symlinks, path components, and
          # every other name that could make Lake read outside this flat data-only directory.
          if find "$STAGING" -mindepth 2 -print -quit | grep -q .; then
            echo "::error::the staged tree is nested; expected a flat directory of artifacts"
            exit 1
          fi
          if find "$STAGING" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::the staged tree holds an entry that is not a regular file"
            exit 1
          fi
          python3 - "$STAGING/outputs.jsonl" <<'PY'
          import json, re, sys

          NAME = re.compile(r"\A[0-9A-Za-z]+(\.[0-9A-Za-z]+)*\Z")

          def check(value, lineno):
              if isinstance(value, str):
                  if not NAME.match(value):
                      sys.exit(
                          f"::error::{path} line {lineno}: {value!r} is not a plain artifact name"
                      )
              elif isinstance(value, list):
                  for item in value:
                      check(item, lineno)
              elif isinstance(value, dict):
                  for key, item in value.items():
                      check(key, lineno)
                      check(item, lineno)

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              lines = 0
              for lineno, line in enumerate(handle, start=1):
                  lines = lineno
                  if lineno > 1:
                      check(json.loads(line), lineno)
          if lines < 2:
              sys.exit(f"::error::{path} contains no root-package output mappings")
          PY

      - name: Install elan (pinned + checksum) and the pinned toolchain
        id: toolchain
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
          REPORTED: ${{ inputs.reported-toolchain }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          case "$TOOLCHAIN" in
            leanprover/lean4:[A-Za-z0-9]*) ;;
            *) echo "::error::lean-toolchain names '$TOOLCHAIN', which is not a leanprover/lean4 release"; exit 1 ;;
          esac
          if [ "$TOOLCHAIN" != "$REPORTED" ]; then
            echo "::error::the staging build used '$REPORTED' but the revision pins '$TOOLCHAIN'"
            exit 1
          fi
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          printf 'name=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Publish the staged Lake cache
        id: upload
        env:
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
          ELAN_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
          STAGING: ${{ runner.temp }}/lake-cache-staging
          REVISION: ${{ inputs.revision }}
          PUBLICATION_REQUIRED: ${{ inputs.publication-required }}
        run: |
          set -euo pipefail
          skip_or_fail() {
            if [ "$PUBLICATION_REQUIRED" = true ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::notice::$1"
            exit 0
          }

          case "$REVISION" in
            *[!0-9a-f]*|'') echo "::error::revision is not a lowercase hexadecimal Git object ID"; exit 1 ;;
          esac
          [ "${#REVISION}" = 40 ] || { echo "::error::revision is not a 40-character Git object ID"; exit 1; }
          [ -n "$S3_ARTIFACT_ENDPOINT" ] && [ -n "$S3_REVISION_ENDPOINT" ] \
            || skip_or_fail 'the Lake cache upload endpoints are not configured'
          [ -n "$PUBLIC_REVISION_ENDPOINT" ] \
            || skip_or_fail 'the public Lake revision endpoint is not configured'
          [ -n "$LAKE_CACHE_KEY_RAW" ] \
            || skip_or_fail 'the LAKE_CACHE_KEY secret is not configured'

          KEY="$LAKE_CACHE_KEY_RAW"
          KEY="${KEY%"${KEY##*[![:space:]]}"}"
          [ -n "$KEY" ] || skip_or_fail 'the LAKE_CACHE_KEY secret is empty after trimming'
          echo "::add-mask::$KEY"
          export LAKE_CACHE_KEY="$KEY"

          CFG="$RUNNER_TEMP/lake-cache.toml"
          cat > "$CFG" <<TOML
          cache.defaultUploadService = "tauceti-r2"
          [[cache.service]]
          name = "tauceti-r2"
          kind = "s3"
          artifactEndpoint = "$S3_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$S3_REVISION_ENDPOINT"
          TOML
          export LAKE_CONFIG="$CFG"

          lake cache put-staged "$STAGING" --service tauceti-r2 \
            --repo TauCetiProject/TauCeti --rev "$REVISION" --toolchain "$ELAN_TOOLCHAIN"

          echo 'uploaded=true' >> "$GITHUB_OUTPUT"
          echo "::notice::uploaded the Lake cache for $REVISION"

      # This is intentionally a separate step. The shared repository helper did not execute while
      # LAKE_CACHE_KEY existed in the upload step's environment, and this step receives no secret.
      # It owns the one public-map URL implementation used by main's probe and toolchain_tags.py,
      # while --expected preserves the publisher's stronger byte-for-byte confirmation.
      - name: Confirm the exact revision map on the public endpoint
        id: confirm
        if: ${{ steps.upload.outputs.uploaded == 'true' }}
        env:
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          ELAN_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
          STAGING: ${{ runner.temp }}/lake-cache-staging
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          observed=0
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/lake_cache_probe.py --repo TauCetiProject/TauCeti \
                --expected "$STAGING/outputs.jsonl" \
                "$PUBLIC_REVISION_ENDPOINT" "$ELAN_TOOLCHAIN" "$REVISION"; then
              observed=1
              break
            fi
            echo "::warning::published revision map is not publicly readable yet (attempt $attempt/6)"
            [ "$attempt" = 6 ] || sleep 10
          done
          [ "$observed" = 1 ] || { echo "::error::the published revision map did not become publicly readable"; exit 1; }
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo "::notice::published and confirmed the Lake cache for $REVISION"

      - name: Report whether publication was confirmed
        id: result
        if: ${{ always() }}
        env:
          CONFIRMED: ${{ steps.confirm.outputs.published }}
        run: |
          if [ "$CONFIRMED" = true ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      # Runs after the secret-bearing step; measures deduplicated mapped payload.
      # Payload size is attempted publication volume, not network transfer bytes.
      - name: Observe publication volume (statistics only)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          STAGING: ${{ runner.temp }}/lake-cache-staging
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
          CONFIRMED: ${{ steps.confirm.outputs.published }}
        run: |
          python3 - <<'PY'
          import json, os, re, stat
          from pathlib import Path

          # Mirrors Lake CacheMap.collectOutputDescrs for structured output values:
          # values (not object keys), numeric hashes -> .art, strings -> hash.extension.
          # Last mapping per input hash wins. Deduplicate artifacts and include the
          # revision map exactly once, as putCore also uploads that separate object.
          MAX_MAP_BYTES = 8 * 1024 * 1024
          MAX_ENTRIES = 100000
          HASH = re.compile(r'[0-9a-fA-F]{16}')
          ARTIFACT = re.compile(r'([0-9a-fA-F]{16})(\.[0-9A-Za-z]+)*')

          def hash_value(value):
              if type(value) is int and 0 <= value < 2**64:
                  return format(value, '016x')
              if isinstance(value, str) and HASH.fullmatch(value):
                  return value.lower()
              raise ValueError('unsupported hash')

          def measure(staging):
              objects = total = 0
              complete = True
              directory = file = None
              try:
                  directory = os.open(staging, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  file = os.open('outputs.jsonl', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
                  info = os.fstat(file)
                  if not stat.S_ISREG(info.st_mode) or info.st_size > MAX_MAP_BYTES:
                      raise ValueError('invalid or oversized map')
                  with os.fdopen(file, 'rb') as handle:
                      file = None
                      data = handle.read(MAX_MAP_BYTES + 1)
                  if len(data) > MAX_MAP_BYTES:
                      raise ValueError('oversized map')
                  lines = data.splitlines()
                  if not lines or len(lines) > MAX_ENTRIES:
                      raise ValueError('map entry limit')
                  if not isinstance(json.loads(lines[0]), str):
                      raise ValueError('unsupported map header')
                  mappings = {}
                  for line in lines[1:]:
                      pair = json.loads(line)
                      if not isinstance(pair, list) or len(pair) < 2:
                          raise ValueError('unsupported map entry')
                      mappings[hash_value(pair[0])] = pair[1]
                  names = set()
                  nodes = 0
                  def collect(value, depth=0):
                      nonlocal nodes
                      nodes += 1
                      if depth > 32 or nodes > MAX_ENTRIES:
                          raise ValueError('output traversal limit')
                      if value is None or type(value) is bool:
                          return
                      if type(value) is int:
                          names.add(hash_value(value) + '.art')
                      elif isinstance(value, str):
                          match = ARTIFACT.fullmatch(value)
                          if not match:
                              raise ValueError('unsupported artifact name')
                          names.add(value[:16].lower() + value[16:])
                      elif isinstance(value, list):
                          for item in value:
                              collect(item, depth + 1)
                      elif isinstance(value, dict):
                          for item in value.values():
                              collect(item, depth + 1)
                      else:
                          raise ValueError('unsupported output value')
                  for value in mappings.values():
                      collect(value)
                  names.add('outputs.jsonl')
                  for name in names:
                      info = os.stat(name, dir_fd=directory, follow_symlinks=False)
                      if not stat.S_ISREG(info.st_mode):
                          raise ValueError('artifact is not regular')
                      objects += 1
                      total += info.st_size
              except (OSError, ValueError, TypeError, RecursionError):
                  complete = False
              finally:
                  if file is not None:
                      os.close(file)
                  if directory is not None:
                      os.close(directory)
              return objects, total, complete

          objects, total, complete = measure(os.environ['STAGING'])
          value = {'schema': 'tauceti-ci.publication/v1', 'trust': 'publisher-host',
                   'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                   'staged_objects': objects, 'staged_bytes': total, 'complete': complete,
                   'volume_scope': 'deduplicated-mapped-artifacts-plus-revision-map',
                   'uploaded': os.environ['UPLOADED'] == 'true',
                   'confirmed': os.environ['CONFIRMED'] == 'true'}
          Path(os.environ['RUNNER_TEMP'], 'ci-publication.json').write_text(json.dumps(value) + '\n')
          PY

      - name: Upload publication observations
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ci-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-publication.json
          if-no-files-found: warn
          retention-days: 30
