name: Mixed queue candidate
run-name: source request=${{ github.event.client_payload.request.request_id }}

on:
  repository_dispatch:
    types: [tauceti-source-candidate-v2]

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read
  id-token: write # required by the shared harness's telemetry job, outside the candidate sandbox

jobs:
  candidate:
    # Deployment remains a separate, explicit operation. Unset is inert.
    if: ${{ vars.TAUCETI_MIXED_QUEUE_CI_ENABLED == 'true' }}
    uses: TauCetiProject/TauCetiTools/.github/workflows/pr-build.yml@fe61c4f22f1e59c4393fe24ed32d22787f3d5e9f
    with:
      tools_repository: TauCetiProject/TauCetiTools
      tools_ref: fe61c4f22f1e59c4393fe24ed32d22787f3d5e9f
      project_ref: ${{ github.workflow_sha }}
      lean_root: TauCeti
      roadmap_dir: TauCetiRoadmap
      source_candidate_enabled: true
      # Wait for reserved staging capacity on tauchonki2; never spill to bulk CI.
      source_candidate_runner: '["self-hosted","linux","x64","tauceti-fleet-staging","fleet-74773fc7f54d4877add11d80113fe340"]'
      source_candidate_control_runner: '{"group":"TauCetiQueueControl","labels":["self-hosted","linux","x64","tauceti-fleet-queue-control","fleet-74773fc7f54d4877add11d80113fe340"]}'
    secrets:
      CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
