name: PR status labels

# Labels use the same pinned merge gate as Auto-merge. A ready label means the PR
# passes its prerequisites; queue membership/reservations are reported separately.
# Only trusted base and pinned policy code execute; PR contents are API data.

# Per-event reconciliation lives in pr-status.yml, which batches bursts of events so that they do not
# each take a GitHub-hosted runner. This workflow keeps the hourly sweep of every open PR and the
# manual re-sync.
on:
  # Hourly backstop: clears a review-in-progress whose in-flight marker has expired with no other
  # event (a crashed review), and self-heals any drift.
  schedule:
    - cron: "5 * * * *"
  # Manual re-sync of one PR or all open PRs.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to reconcile, or all for a complete backfill"
        required: true
        type: string

# The default GITHUB_TOKEN is used only for checkout; all label writes go through the scoped App token.
permissions:
  contents: read

jobs:
  # Manual re-sync of one PR: validate the untrusted input down to digits in `resolve`, so that
  # `label-resolved` can key its concurrency group on it.
  resolve:
    if: >
      github.repository == 'TauCetiProject/TauCeti'
      && github.event_name == 'workflow_dispatch' && inputs.pr != 'all'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-pull-requests: read
      - id: r
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          pr="$INPUT_PR"
          # Validate: `pr` is untrusted for workflow_dispatch (any string), so only ever emit digits.
          if [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            echo "no single PR resolved (pr='${pr:-}'); skipping"
          fi

  label-resolved:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    # The same group as `label`, so the two paths serialize against each other. See that job for why
    # cancel-in-progress stays false.
    concurrency:
      group: pr-labels-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
      # The trusted base checkout: the labels script that runs is the one on the target branch, never
      # the version proposed by the PR.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pr_status
          persist-credentials: false
      - name: Checkout the pinned merge policy (read-only)
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiReview
          ref: 95fa10ea655e8dacfcc84b8cd3f3e482e8c852ae
          path: .tauceti-review
          sparse-checkout: runner
          persist-credentials: false

      - name: Reconcile status label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: python3 scripts/pr_status/labels.py reconcile "$PR"

  # Reconcile every open PR on the backstop or an explicit migration/backfill.
  # Per-PR jobs can overlap this pass; both read fresh state and converge.
  sweep:
    if: >-
      github.repository == 'TauCetiProject/TauCeti'
      && (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.pr == 'all'))
    runs-on: ubuntu-latest
    concurrency:
      group: pr-labels-sweep
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pr_status
          persist-credentials: false
      - name: Checkout the pinned merge policy (read-only)
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiReview
          ref: 95fa10ea655e8dacfcc84b8cd3f3e482e8c852ae
          path: .tauceti-review
          sparse-checkout: runner
          persist-credentials: false

      - name: Reconcile open PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: python3 scripts/pr_status/labels.py reconcile-all
