name: PR status labels

# Labels use the same pinned merge gate as Auto-merge. A ready label means the PR
# passes its prerequisites; queue membership/reservations are reported separately.
# Only trusted base and pinned policy code execute; PR contents are API data.

# Per-event reconciliation lives in pr-status.yml, which batches bursts of events so that they do not
# each take a GitHub-hosted runner. This workflow keeps the hourly backstop sweep and the manual
# re-sync.
on:
  # Hourly backstop: clears a review-in-progress whose in-flight marker has expired with no other
  # event (a crashed review), and self-heals any drift. Each run rechecks only the PRs that no event
  # will revisit (see the `sweep` job), so it finishes well within the App token's one-hour life.
  schedule:
    - cron: "5 * * * *"
  # Manual re-sync of one PR or all open PRs.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to reconcile, or all for a complete backfill"
        required: true
        type: string

# Lifecycle label writes use the scoped App token; the workflow token reconciles PR-CI routing.
permissions:
  contents: read
  statuses: write
  issues: write
  actions: write

jobs:
  # Manual re-sync of one PR: validate the untrusted input down to digits in `resolve`, so that
  # `label-resolved` can key its concurrency group on it.
  resolve:
    if: >
      github.repository == 'TauCetiProject/TauCeti'
      && github.event_name == 'workflow_dispatch' && inputs.pr != 'all'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-pull-requests: read
      - id: r
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          SELF_TESTED_WRITE_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          pr="$INPUT_PR"
          # Validate: `pr` is untrusted for workflow_dispatch (any string), so only ever emit digits.
          if [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            echo "no single PR resolved (pr='${pr:-}'); skipping"
          fi

  label-resolved:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    # The same group as `label`, so the two paths serialize against each other. See that job for why
    # cancel-in-progress stays false.
    concurrency:
      group: pr-labels-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
          permission-members: read
      # The trusted base checkout: the labels script that runs is the one on the target branch, never
      # the version proposed by the PR.
      - uses: actions/checkout@v4
        with:
          # The policy checkout below is a local action, so it must come from this trusted checkout.
          sparse-checkout: |
            scripts/pr_status
            .github/actions/checkout-merge-policy
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@a94bf58e6032630c65da1a61a989bfb985ad8cd0
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: a94bf58e6032630c65da1a61a989bfb985ad8cd0
          project-directory: .
      - name: Checkout the pinned merge policy (read-only)
        uses: ./.github/actions/checkout-merge-policy

      - name: Reconcile status label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          SELF_TESTED_WRITE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: python3 scripts/pr_status/labels.py reconcile "$PR"

  # The scheduled backstop, or an explicit migration/backfill of every open PR (`pr: all`).
  # Per-PR jobs can overlap this pass; both read fresh state and converge.
  #
  # The schedule does not reconcile every open PR. With about three thousand open PRs a full pass
  # took about two hours: it outlived the App installation token (one hour, so every PR after the
  # first hour failed with HTTP 401) or spent the installation's REST quota, which pr-status.yml
  # shares. The event-driven batch already revisits every PR with activity, so the schedule takes
  # the PRs it cannot reach: those with no lifecycle label or more than one, those showing
  # review-in-progress (its expiry raises no event), and a rotating 1/24 slice of the rest, so every
  # open PR is still rechecked over 24 runs. Selection is one paginated GraphQL listing, which does
  # not draw on the REST quota. A manual `all` keeps the complete pass.
  sweep:
    if: >-
      github.repository == 'TauCetiProject/TauCeti'
      && (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.pr == 'all'))
    runs-on: ubuntu-latest
    # Inside the installation token's one-hour life; the step's own budget stops earlier.
    timeout-minutes: 55
    concurrency:
      group: pr-labels-sweep
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
          permission-members: read
      - uses: actions/checkout@v4
        with:
          # The policy checkout below is a local action, so it must come from this trusted checkout.
          sparse-checkout: |
            scripts/pr_status
            .github/actions/checkout-merge-policy
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@a94bf58e6032630c65da1a61a989bfb985ad8cd0
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: a94bf58e6032630c65da1a61a989bfb985ad8cd0
          project-directory: .
      - name: Checkout the pinned merge policy (read-only)
        uses: ./.github/actions/checkout-merge-policy

      - name: Reconcile open PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          SELF_TESTED_WRITE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          FULL_PASS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          SLICES: "24"
          # Stop starting PRs after 40 minutes; the remainder is picked up by later runs.
          BUDGET_SECONDS: "2400"
          # labels.py STATUS_LABELS; pr-status.yml's label filter uses the same list.
          LIFECYCLE: '["awaiting-CI","awaiting-review","review-in-progress","ci-failed","awaiting-author","merge-check-failed","needs-human-review","awaiting-dependency","on-hold","ready-to-merge"]'
        run: |
          set -euo pipefail
          if [[ "$FULL_PASS" == 1 ]]; then
            exec python3 scripts/pr_status/labels.py reconcile-all
          fi
          owner=${REPO%/*}
          name=${REPO#*/}
          export SLICE=$((RUN_NUMBER % SLICES))
          # One line per open PR: "<number> <priority>", priority 0 for drift or an in-flight review,
          # 1 for this run's slice. Other PRs are omitted.
          gh api graphql --paginate -F owner="$owner" -F name="$name" \
            -f query='query($owner:String!,$name:String!,$endCursor:String){repository(owner:$owner,name:$name){pullRequests(states:OPEN,first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{number labels(first:100){nodes{name}}}}}}' \
            --jq '.data.repository.pullRequests.nodes[]
                  | (env.LIFECYCLE | fromjson) as $lifecycle
                  | [.labels.nodes[].name | select(IN($lifecycle[]))] as $mine
                  | if ($mine | length) != 1 or ("review-in-progress" | IN($mine[])) then "\(.number) 0"
                    elif .number % (env.SLICES | tonumber) == (env.SLICE | tonumber) then "\(.number) 1"
                    else empty end' > "$RUNNER_TEMP/candidates"
          prs=()
          while read -r pr _; do prs+=("$pr"); done < <(sort -k2,2n -k1,1nr "$RUNNER_TEMP/candidates")
          echo "slice $SLICE/$SLICES: ${#prs[@]} PRs to reconcile ($(grep -c ' 0$' "$RUNNER_TEMP/candidates" || true) drift or in-flight review)"
          failures=()
          done_count=0
          for pr in "${prs[@]}"; do
            if (( SECONDS >= BUDGET_SECONDS )); then
              echo "::warning::time budget spent; $(( ${#prs[@]} - done_count )) PRs left for later runs"
              break
            fi
            done_count=$((done_count + 1))
            if out=$(python3 scripts/pr_status/labels.py reconcile "$pr" 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              failures+=("$pr")
              # A rate limit refuses every later PR as well; stop instead of spending more calls.
              if grep -qiE 'rate ?limit|HTTP 401' <<< "$out"; then
                echo "::error::stopping after PR #$pr: GitHub refused the token or its quota"
                break
              fi
            fi
          done
          echo "Sweep: $((done_count - ${#failures[@]}))/${#prs[@]} reconciled; failures=${failures[*]:-none}"
          [[ ${#failures[@]} -eq 0 ]]
