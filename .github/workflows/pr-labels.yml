name: PR status labels

# Labels use the same pinned merge gate as Auto-merge. A ready label means the PR
# passes its prerequisites; queue membership/reservations are reported separately.
# Only trusted base and pinned policy code execute; PR contents are API data.

# Per-event reconciliation lives in pr-status.yml, which batches bursts of events so that they do not
# each take a GitHub-hosted runner. This workflow keeps the hourly sweep of every open PR and the
# manual re-sync.
on:
  # Hourly backstop: clears a review-in-progress whose in-flight marker has expired with no other
  # event (a crashed review), and self-heals any drift.
  schedule:
    - cron: "5 * * * *"
  # Manual re-sync of one PR or all open PRs.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to reconcile, or all for a complete backfill"
        required: true
        type: string

# Lifecycle label writes use the scoped App token; the workflow token reconciles PR-CI routing.
permissions:
  contents: read
  statuses: write
  issues: write
  actions: write

jobs:
  # Manual re-sync of one PR: validate the untrusted input down to digits in `resolve`, so that
  # `label-resolved` can key its concurrency group on it.
  resolve:
    if: >
      github.repository == 'TauCetiProject/TauCeti'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'workflow_dispatch' && inputs.pr != 'all'
    runs-on:
      group: TauCetiPRStatus
      labels: [self-hosted, linux, x64, tauceti-fleet-pr-status]
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - id: r
        env:
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          pr="$INPUT_PR"
          # Validate: `pr` is untrusted for workflow_dispatch (any string), so only ever emit digits.
          if [[ "${pr:-}" =~ ^[0-9]+$ ]]; then
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            echo "no single PR resolved (pr='${pr:-}'); skipping"
          fi

  label-resolved:
    timeout-minutes: 10
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on:
      group: TauCetiPRStatus
      labels: [self-hosted, linux, x64, tauceti-fleet-pr-status]
    # The same group as `label`, so the two paths serialize against each other. See that job for why
    # cancel-in-progress stays false.
    concurrency:
      group: pr-labels-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
          permission-members: read
      # The trusted base checkout: the labels script that runs is the one on the target branch, never
      # the version proposed by the PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          # The policy checkout below is a local action, so it must come from this trusted checkout.
          sparse-checkout: |
            scripts/pr_status
            .github/actions/checkout-merge-policy
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@fde8de7370d5ea85493e23968edc377aaadb60df
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: fde8de7370d5ea85493e23968edc377aaadb60df
          project-directory: .
      - name: Checkout the pinned merge policy (read-only)
        uses: ./.github/actions/checkout-merge-policy

      - name: Reconcile status label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          SELF_TESTED_WRITE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: python3 scripts/pr_status/labels.py reconcile "$PR"

  # Reconcile every open PR on the backstop or an explicit migration/backfill.
  # Per-PR jobs can overlap this pass; both read fresh state and converge.
  sweep:
    timeout-minutes: 40
    if: >-
      github.repository == 'TauCetiProject/TauCeti'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.pr == 'all'))
    runs-on:
      group: TauCetiPRStatus
      labels: [self-hosted, linux, x64, tauceti-fleet-pr-status]
    concurrency:
      group: pr-labels-sweep
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
          permission-members: read
      - uses: actions/checkout@v4
        with:
          ref: main
          # The policy checkout below is a local action, so it must come from this trusted checkout.
          sparse-checkout: |
            scripts/pr_status
            .github/actions/checkout-merge-policy
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@fde8de7370d5ea85493e23968edc377aaadb60df
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: fde8de7370d5ea85493e23968edc377aaadb60df
          project-directory: .
      - name: Checkout the pinned merge policy (read-only)
        uses: ./.github/actions/checkout-merge-policy

      - name: Restore sweep progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sweep-in"
          trusted_run=$(cat scripts/pr_status/trusted-sweep-run.jq)
          ids=$(gh api "repos/$REPO/actions/artifacts?name=pr-labels-progress&per_page=10" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | .workflow_run.id')
          for id in $ids; do
            if trusted=$(gh api "repos/$REPO/actions/runs/$id" --jq "$trusted_run") && [ "$trusted" = true ]; then
              if gh run download "$id" -R "$REPO" -n pr-labels-progress -D "$RUNNER_TEMP/sweep-in"; then
                break
              fi
              rm -f "$RUNNER_TEMP/sweep-in/state.json"
            fi
          done

      - name: Reconcile open PRs within the App token lifetime
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          SELF_TESTED_WRITE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/sweep-out"
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/pr_status/batch.py --since "$since" --all-open --prioritize-self-tested \
            --budget-seconds 1800 --state-in "$RUNNER_TEMP/sweep-in/state.json" \
            --state-out "$RUNNER_TEMP/sweep-out/state.json"

      - name: Save sweep progress and pending decision ages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-labels-progress
          path: ${{ runner.temp }}/sweep-out/state.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
