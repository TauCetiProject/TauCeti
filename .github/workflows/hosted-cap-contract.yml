name: Hosted concurrency contract

# A manual platform probe, not a regression suite for each workflow edit.
# GitHub's queue semantics do not change when our picker changes. Keep ordinary
# workflow regression coverage in scripts/test_pick_runner.py.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  native-queue:
    # Three jobs enter one group together. All three must complete: the default
    # one-pending behavior would cancel one. This uses GitHub-hosted capacity.
    strategy:
      fail-fast: false
      matrix:
        entrant: [1, 2, 3]
    concurrency:
      group: hosted-cap-contract-${{ github.run_id }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo 'Native concurrency queue accepted entrant ${{ matrix.entrant }}'
