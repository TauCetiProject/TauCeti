name: CI

# The post-merge health check on main. The jobs are TauCetiTools' ci.yml at main, which explains
# the build, the audits and the cache publication fallback. This file keeps what GitHub reads from
# the repository where the event happens: the trigger, the concurrency group, the GITHUB_TOKEN
# ceiling and the one secret, which only the isolated publish job receives. Its jobs appear as
# `ci / build` and `ci / publish-lake-cache / publish`. PR builds are pr-build.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # scripts/lint-scope.sh reads the merged PRs' labels and branches

# This workflow is main's post-merge check, not its cache publisher. Each merge-queue
# landing fast-forwards main to a staging tip whose Lake cache pr-build.yml's
# publish-merge-group-cache job published before the landing, and the queue
# dispatches staging only on a base whose cache is published. The publish-lake-cache
# job in TauCetiTools' ci.yml is a best-effort fallback for pushes made outside the queue: it skips
# when the exact map is already public, and nothing may wait for it. A cold rebuild
# (a Mathlib or toolchain bump pushed directly) can exceed the hosted runner's 6h
# limit; the queue then waits for that base, and alerts, until it is published.
#
# GitHub retains at most one running and one pending run in this group: the running
# build is never cancelled, while superseded pending commits do not each start an
# expensive rebuild. In a burst, this deliberately coalesces intermediate commits'
# post-merge checks; the newest pending tip rechecks the entire tree, though
# localizing a failure may then require bisection. Dependency reconciliation uses
# conclusive runs as evidence for the current pin, skipping coalesced commits
# without a completed build.
concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  ci:
    uses: TauCetiProject/TauCetiTools/.github/workflows/ci.yml@main
    with:
      tools_repository: TauCetiProject/TauCetiTools
      lean_root: TauCeti
      roadmap_dir: TauCetiRoadmap
    secrets:
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
