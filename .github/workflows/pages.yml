name: Pages

# Build the Verso website in web/ and deploy it to GitHub Pages.
#
# The site project (web/) depends only on Verso. The type-checked theorem snippets are
# extracted by SubVerso from web/examples/ — a separate project that imports the real
# TauCeti library (and hence Mathlib) — so the showcased mathematics is elaborated at
# build time and cannot drift. The examples project is built first; its Mathlib oleans
# come from the cache, not a from-scratch rebuild.
#
# The API reference under /docs is generated by api-docs.yml, which saves each finished tree to
# the actions cache under a run-specific `docs-html-v2-...` key. Every run here publishes the
# newest of those, so a site deploy never waits for doc-gen4, and the docs a deploy carries are
# at most one api-docs.yml run old.
#
# Scheduled and workflow_dispatch runs regenerate the Statistics page's "lines of code by date"
# charts straight from git history (see scripts/loc_graph.py). Push-triggered deploys reuse the
# cached generated data instead, preserving its embedded timestamps and coverage. Generated
# updates are not committed back; the repository carries fallback SVGs for cache misses and local
# builds. During refreshes, the per-roadmap chart (scripts/loc_roadmap_graph.py) is regenerated
# from PR labels rather than git, since roadmap attribution lives in the
# `roadmap/<Area>` labels; it reuses the bors-aware PR snapshot below. The
# participation snapshot likewise reads GitHub through gh, but deduplicates the current
# human actors instead of reconstructing a historical series. Pull-request queue, review-cycle,
# throughput, and contributor charts come from scripts/pr_stats_graphs.py. The three-hour
# `schedule` below redeploys the site so the charts track the project as it grows.
# (This replaces the old loc-graph workflow, which committed the SVGs to main on a
# schedule; main now sits behind a merge queue that refuses direct pushes, so generating
# the charts in this build is the only way they refresh.)
#
# The jobs are TauCetiTools' pages.yml at main, which documents how data preparation, the site
# build, the fallback, the deploy and the docgen branch update work. This file keeps what GitHub
# reads from the repository where the event happens: triggers, concurrency, the GITHUB_TOKEN
# ceiling and the secrets. Its jobs appear as `pages / <job>`. Deploys still go through this
# repository's `github-pages` environment.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/arxiv_categories.py'
      - 'scripts/chart_style.py'
      - 'scripts/loc_graph.py'
      - 'scripts/roadmap_completion.py'
      - 'scripts/loc_roadmap_graph.py'
      - 'scripts/participant_graph.py'
      - 'scripts/pr_stats_graphs.py'
      - 'scripts/pipeline_health.py'
      - 'scripts/ci_stats_graphs.py'
      - 'scripts/ci_report_assets.py'
      - 'scripts/ci_daily_graphs.py'
      - 'scripts/generated_assets.py'
      - 'scripts/roadmap_progress.py'
      - 'scripts/roadmap_coverage.json'
      - 'scripts/roadmap_links.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: "31 */3 * * *"   # Every three hours (UTC): refresh the charts and pick up the latest API docs
  workflow_dispatch:

permissions:
  # These scopes govern this repository. Reads from the other three repositories
  # rely on their public visibility.
  contents: read
  pages: write
  id-token: write
  issues: read      # issue participants in this repository
  pull-requests: read # roadmap labels and PR participants
  statuses: read      # exact-head merge-readiness audit

concurrency:
  group: pages
  # Let an active deployment finish before a newly triggered run starts.
  cancel-in-progress: false

jobs:
  pages:
    uses: TauCetiProject/TauCetiTools/.github/workflows/pages.yml@main
    with:
      lean_root: TauCeti
      roadmap_repository: TauCetiProject/TauCetiRoadmap
      site_title: Tau Ceti
      chart_accent: "#ff9d4d"
    secrets:
      # The App that moves the docgen branch (the workflow token cannot cross workflow changes).
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
