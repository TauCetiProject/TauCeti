name: Pages

# Build the Verso website in web/ and deploy it to GitHub Pages.
#
# The site project (web/) depends only on Verso. The type-checked theorem snippets are
# extracted by SubVerso from web/examples/ — a separate project that imports the real
# TauCeti library (and hence Mathlib) — so the showcased mathematics is elaborated at
# build time and cannot drift. The examples project is built first; its Mathlib oleans
# come from the cache, not a from-scratch rebuild.
#
# The API reference under /docs is generated by doc-gen4 from the nested docbuild/ project
# (which requires the real TauCeti library and shares the parent's Mathlib pin). With
# interproject linking (DOCGEN_LOCAL_MODULE_ROOTS / DOCGEN_DEPS_DOCS_URL, see the doc build
# step) doc-gen4 renders pages for only the TauCeti.* modules and links references to Mathlib
# out to the hosted mathlib4_docs, so the output is small (tens of MB, not the whole rendered
# closure). It is normally rebuilt every three hours — on the schedule below, plus the first
# run that finds no cached docs — and cached under a run-specific key. A push that touches
# only web/ (or the chart scripts) reuses the cached docs, since the mathematics has not
# changed, so those site deploys stay fast.
#
# The Statistics page's "lines of code by date" charts are regenerated here, at deploy
# time, straight from git history (see scripts/loc_graph.py) — they are not committed
# state. The per-roadmap chart (scripts/loc_roadmap_graph.py) is regenerated the same
# way, but from the PR labels rather than git, since roadmap attribution lives in the
# `roadmap/<Area>` labels; it reads them via gh (hence pull-requests: read below). The
# participation snapshot likewise reads GitHub through gh, but deduplicates the current
# human actors instead of reconstructing a historical series. Pull-request queue, review-cycle,
# throughput, and contributor charts come from scripts/pr_stats_graphs.py. The three-hour
# `schedule` below redeploys the site so the charts track the project as it grows.
# (This replaces the old loc-graph workflow, which committed the SVGs to main on a
# schedule; main now sits behind a merge queue that refuses direct pushes, so generating
# the charts in this build is the only way they refresh.)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docbuild/**'
      - 'scripts/chart_style.py'
      - 'scripts/loc_graph.py'
      - 'scripts/loc_roadmap_graph.py'
      - 'scripts/participant_graph.py'
      - 'scripts/pr_stats_graphs.py'
      - 'scripts/pipeline_health.py'
      - 'scripts/roadmap_progress.py'
      - 'scripts/roadmap_topics.json'
      - 'scripts/roadmap_coverage.json'
      - 'scripts/roadmap_links.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: "23 */3 * * *"   # Every three hours (UTC): refresh the charts and API docs
  workflow_dispatch:

permissions:
  # These scopes govern this repository. Reads from the other three repositories
  # rely on their public visibility.
  contents: read
  pages: write
  id-token: write
  issues: read      # issue participants in this repository
  pull-requests: read # roadmap labels and PR participants
  statuses: read      # exact-head merge-readiness audit

concurrency:
  group: pages
  # Let an active deployment finish before a newly triggered run starts.
  cancel-in-progress: false

env:
  # Run JavaScript actions on Node 24 (Node 20 is deprecated on GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Temporary escape hatch for `lake exe cache get`, kept only for an easy rollback
  # during the transition to the cache tool's new default read endpoint. Set the
  # variable to `1` to send cache reads back to the legacy storage endpoint. Clear it to
  # return reads to the default endpoint on the next run: the cache tool treats unset,
  # empty, `0`, and `false` alike as off.
  MATHLIB_CACHE_DEBUG_USE_LEGACY: ${{ vars.MATHLIB_CACHE_DEBUG_USE_LEGACY }}

jobs:
  # Named `build-site`, not `build`, to keep every job name distinct from the required `build` commit
  # status context (see pr-build.yml's header note on that collision). This workflow only runs on
  # push-to-main / schedule, never on a PR, so its check-run can't wedge a PR today — the distinct name
  # is hygiene so a future PR trigger here could never reintroduce the collision.
  # The data assets are generated here, in a job with no Lean in it. They are cheap -- minutes,
  # all Python and gh -- whereas `build-site` below elaborates TauCeti twice and runs for hours.
  # The two used to fail together for no better reason than sharing a job: an unrelated Verso
  # error in Site.Front meant nothing deployed, so a perfectly good pipeline-health.json derived
  # ninety minutes earlier in that same job was thrown away. Separating them means a site that
  # will not compile can no longer make the published data stale by itself, and a data outage
  # shows up in minutes rather than after the whole doc build has run.
  build-data:
    runs-on: ubuntu-latest
    outputs:
      # Which of the generated data assets could not be regenerated this run. The steps that
      # produce them are deliberately non-fatal -- a GitHub hiccup should cost a stale chart, not
      # the whole site deploy -- but "non-fatal" turned into "invisible": the PR statistics step
      # failed on every run from 2026-09-04, so the snapshot it dumps was never written, so
      # pipeline-health.json was skipped every time and never existed at all, and the run stayed
      # green throughout. The report-data-freshness job below turns this back into a red run,
      # AFTER the deploy, so both properties hold at once.
      data-failures: ${{ steps.data-failures.outputs.assets }}
    steps:
      # Full history: scripts/loc_graph.py reconstructs the whole "lines by date"
      # series by walking every commit, so a shallow checkout would truncate the charts.
      - uses: actions/checkout@v4
        with:
          # Same reasoning as ci.yml's build checkout: the token this workflow grants carries
          # `pages: write` and `id-token: write`, not just `contents: read`, so left in the
          # workspace .git/config it would be readable by anything that reads the config. This
          # job runs no Lean, but it does run the generator scripts, and they are handed an
          # explicit GH_TOKEN per step rather than reading one out of the checkout. The only git
          # command here is a clone of the public roadmap repository, the history this checkout
          # fetches is used locally, and the branch update lives in the separate
          # advance-docgen-ref job with its own GH_TOKEN.
          persist-credentials: false
          fetch-depth: 0

      # Every generator below is deliberately non-fatal and leaves "whatever was there" in
      # place. For the charts that is the committed fallback SVG. pipeline-health.json has no
      # committed fallback and never will -- it is derived state, not a checked-in asset -- so
      # without this there is nothing for a failed generator to leave behind, and the run would
      # publish a static tree with no pipeline-health.json at all, DELETING the live endpoint
      # that the rest of this change exists to keep fresh. Restoring the last published set
      # first makes "keep the previous one" true for the generated data too.
      - name: Restore the last published data assets
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/web/static_files
          # Always a miss, so the save below always writes a fresh entry; the prefix restores
          # the newest previous set.
          key: site-data-v1-${{ github.run_id }}
          restore-keys: site-data-v1-

      - name: Clone the roadmap repository (full history, for its chart)
        working-directory: ${{ github.workspace }}
        run: git clone --quiet https://github.com/TauCetiProject/TauCetiRoadmap.git /tmp/roadmap

      # Overwrites the checked-in SVGs in the runner only (never committed back). The
      # versions tracked in web/static_files/ are just fallback snapshots so a local
      # `cd web && lake exe web` renders something; refresh them by running these same
      # two commands. The deployed charts always come from this step, not from the repo.
      - name: Regenerate the lines-of-code charts into static_files
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/loc_graph.py \
            --repo . --ref HEAD \
            --title "Tau Ceti — lines of Lean" --accent "#ff9d4d" \
            --out web/static_files/loc-tauceti.svg \
            TauCeti TauCeti.lean
          python3 scripts/loc_graph.py \
            --repo /tmp/roadmap --ref HEAD \
            --title "Tau Ceti Roadmap — lines written" --accent "#5eead4" \
            --out web/static_files/loc-roadmap.svg \
            TauCetiRoadmap TauCetiRoadmap.lean

      # The per-roadmap chart is built from the PR labels (roadmap attribution is not in
      # git), so it queries gh rather than walking commits. A gh failure here must not sink
      # the whole deploy — the committed fallback SVG stays in place if the query fails.
      - name: Regenerate the per-roadmap chart into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/loc_roadmap_graph.py \
            --repo "${{ github.repository }}" \
            --title "Tau Ceti — lines of Lean per roadmap" \
            --out web/static_files/loc-per-roadmap.svg \
          || {
            echo "::warning::per-roadmap chart generation failed; keeping the last published SVG"
            echo "per-roadmap chart" >> "$RUNNER_TEMP/data-failures"
          }

      # A current snapshot rather than a historical series: participants are deduplicated
      # across PRs, issues, comments/reviews, and default-branch commits in all four repos.
      # This API scan runs only in the scheduled/deploy build, never at request time.
      - name: Regenerate the participation snapshot into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/participant_graph.py \
            --out web/static_files/participation.svg \
          || {
            echo "::warning::participation graph generation failed; keeping the last published SVG"
            echo "participation snapshot" >> "$RUNNER_TEMP/data-failures"
          }

      # Walking every pull request's label timeline costs one GraphQL request each, against a
      # budget of 5000 an hour. At ~4600 open-or-recently-closed pull requests that no longer
      # fits -- which is how this step started failing outright -- and the project adds about
      # ninety a day, so it cannot be made to fit again by trimming. The snapshot is therefore
      # carried between runs: a pull request whose `updatedAt` has not moved keeps its recorded
      # timeline, and only what actually changed in the last three hours is fetched.
      #
      # A restore miss is not a failure. The generator falls back to the full walk and waits out
      # a depleted budget rather than giving up, so a cold start (first run, or an evicted entry)
      # still completes; it just costs an hour of waiting instead of three minutes.
      - name: Restore the previous pull-request snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pr-snapshot.json
          # Always a miss, so the save below always writes a fresh entry; the prefix is what
          # actually restores the newest previous snapshot.
          key: pr-snapshot-${{ github.run_id }}
          restore-keys: pr-snapshot-

      # PR history and current queue state come from GitHub rather than git. The generator
      # paginates both the PR connection and each label timeline, and bounds contributor
      # rendering so growth in participation cannot make the deployed SVG unmanageably large.
      - name: Regenerate the pull-request statistics into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reads the restored snapshot and overwrites it with the new one. The generator loads
          # it fully before writing anything, so naming one path for both is safe.
          python3 scripts/pr_stats_graphs.py \
            --repo "${{ github.repository }}" \
            --out-dir web/static_files \
            --since-data "$RUNNER_TEMP/pr-snapshot.json" \
            --dump-data "$RUNNER_TEMP/pr-snapshot.json" \
          || {
            echo "::warning::PR statistics generation failed; keeping the committed fallback assets"
            echo "pull-request statistics" >> "$RUNNER_TEMP/data-failures"
          }

      # Gated on the file existing, because actions/cache/save errors on a missing path and this
      # step must never be the thing that fails the job it exists to make cheaper.
      - name: Check whether a snapshot is present to save
        id: snapshot
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -s "$RUNNER_TEMP/pr-snapshot.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the pull-request snapshot for the next run
        # Saved even when the step above failed: an older or partial snapshot still spares the
        # next run most of the walk, and the alternative is that one bad run condemns every later
        # one to a cold start.
        if: always() && steps.snapshot.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pr-snapshot.json
          key: pr-snapshot-${{ github.run_id }}

      # Pipeline health reuses the snapshot the charts just fetched rather than
      # walking every PR timeline a second time: that walk is thousands of
      # requests and the dominant cost of this job. Publishing the result means
      # anything asking "where is the queue stuck" reads a file instead of
      # repeating the fetch.
      - name: Checkout the pinned merge policy (read-only)
        id: merge-policy
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiReview
          ref: 692ebde95eea2a6d9d9f21954ba912c49f675d9d
          path: .tauceti-review
          sparse-checkout: runner
          persist-credentials: false

      - name: Derive pipeline health from the same snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ steps.merge-policy.outcome }}" != "success" ]; then
            echo "::warning::merge policy unavailable; publishing unverified readiness"
            echo "merge readiness policy" >> "$RUNNER_TEMP/data-failures"
          fi
          if [ -s "$RUNNER_TEMP/pr-snapshot.json" ]; then
            python3 scripts/pipeline_health.py \
              --data "$RUNNER_TEMP/pr-snapshot.json" --verify-readiness \
              --out web/static_files/pipeline-health.json \
              --json > /dev/null \
            || {
              echo "::warning::pipeline health generation failed"
              echo "pipeline health" >> "$RUNNER_TEMP/data-failures"
            }
          else
            echo "::warning::no PR snapshot; skipping pipeline health"
            echo "pipeline health (no snapshot)" >> "$RUNNER_TEMP/data-failures"
          fi
          # The published file is what every reader of "where is the queue stuck" fetches, so a
          # run that does not write one has not done its job even if the site deploys. Recorded
          # as a data failure and not merely warned about: a warning notifies nobody, which is
          # how this went unnoticed for a day.
          if [ ! -s web/static_files/pipeline-health.json ]; then
            echo "::warning::pipeline-health.json was not written"
            echo "pipeline health (no file)" >> "$RUNNER_TEMP/data-failures"
          fi

      # The Progress page's board: one row per roadmap, one segment per layer, from the roadmap
      # clone above plus the roadmap labels on merged pull requests. It reads the PR snapshot the
      # statistics step just fetched rather than walking GitHub again; without one it pages the
      # merged pull requests itself, which is a few dozen requests. As with the charts, a failure
      # keeps the committed fallback JSON in place rather than sinking the deploy.
      - name: Regenerate the roadmap progress board into static_files
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data_arg=()
          if [ -s "$RUNNER_TEMP/pr-snapshot.json" ]; then
            data_arg=(--data "$RUNNER_TEMP/pr-snapshot.json")
          fi
          python3 scripts/roadmap_progress.py \
            --roadmap-dir /tmp/roadmap \
            --repo "${{ github.repository }}" \
            "${data_arg[@]}" \
            --out web/static_files/progress.json \
          || {
            echo "::warning::roadmap progress generation failed; keeping the committed fallback JSON"
            echo "roadmap progress" >> "$RUNNER_TEMP/data-failures"
          }

      # An explicit allowlist of GENERATED assets, not the whole directory. static_files also
      # holds site.js, progress.js, style.css and the icons -- the front end, which belongs to
      # the commit whose HTML is being served. Shipping those through this artifact would let
      # the fallback below lay this commit's JavaScript and CSS over the last successfully
      # built HTML, and the case where the site failed to build is exactly the case where a
      # front-end change might be the reason. Data travels; the front end does not.
      - name: Collect the generated data assets
        id: collect
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-data"
          missing=()
          # Asked of the generators, not restated here. This list was written out by hand, so
          # adding a chart meant editing two files -- and when those edits landed in two
          # different pull requests, the two roadmap/contributor grids were generated into
          # static_files and then not carried. The site referenced two images that never
          # arrived, and nothing failed: the artifact was simply missing them.
          for asset in $(python3 scripts/generated_assets.py)
          do
            if [ -s "web/static_files/$asset" ]; then
              cp "web/static_files/$asset" "$RUNNER_TEMP/site-data/$asset"
            else
              missing+=("$asset")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::not carrying ${missing[*]}: absent or empty"
          fi
          # pipeline-health.json is the one every poller reads. If neither this run nor the
          # restore above produced one, say so as a data failure rather than shipping a set
          # that would silently remove it from the site.
          if [ ! -s "$RUNNER_TEMP/site-data/pipeline-health.json" ]; then
            echo "pipeline health (nothing to publish)" >> "$RUNNER_TEMP/data-failures"
          fi

      - name: Collect which data assets could not be regenerated
        id: data-failures
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -s "$RUNNER_TEMP/data-failures" ]; then
            {
              echo "assets<<EOF"
              paste -sd ', ' "$RUNNER_TEMP/data-failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "assets=" >> "$GITHUB_OUTPUT"
          fi

      # Saved for the next run to restore, so a generator that fails then still has a
      # last-good asset to leave in place. Never allowed to fail the job: this is an
      # optimisation against future outages, not a precondition for this deploy.
      - name: Save the data assets for the next run
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/web/static_files
          key: site-data-v1-${{ github.run_id }}

      - name: Hand the generated data to the site build
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: ${{ runner.temp }}/site-data
          retention-days: 7

  build-site:
    # `!cancelled()` rather than `always()`: the data steps are deliberately non-fatal, so a run
    # that can only report a stale chart must still publish the site -- but `always()` is also
    # true while a run is being cancelled, and a cancelled run must not go on to deploy. What
    # this job wants from build-data is the artifact, and it copes with that being absent.
    needs: build-data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      # The commit the /docs actually being deployed were generated from, read from the tree itself.
      # This is what `advance-docgen-ref` follows; there is deliberately no output for whether a
      # rebuild was *planned*, because that says nothing about what ended up being published.
      docs-source-sha: ${{ steps.fold.outputs.docs-source-sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reasoning as build-data's checkout, and it matters more here: this job elaborates
          # TauCeti twice (the doc-gen4 build and the examples build), so a token left in
          # .git/config would be readable by code running at elaboration time, which could then
          # publish to the project's Pages site.
          persist-credentials: false
          fetch-depth: 0

      # Overwrites the checked-in SVGs in the runner only, never committed back -- exactly what
      # the generators did when they ran in this job. A miss is survivable rather than fatal: the
      # checkout above already carries the committed fallbacks, so the site still builds and
      # deploys, and report-data-freshness is what makes the run red about it.
      - name: Lay down the generated data
        id: site-data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-data
          path: web/static_files

      - name: Note when the site is building against fallback data
        if: steps.site-data.outcome != 'success'
        run: echo "::warning::no site-data artifact; building the site against the committed fallback assets"

      # Pinned leanprover/elan release, verified by SHA-256, rather than whatever the installer
      # URL serves at the moment of the request; this elan chooses the toolchain that builds the
      # documentation this job deploys. scripts/test_elan_pin.py keeps the copies of the pin honest.
      - name: Install elan (pinned + checksum)
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # --- API documentation (doc-gen4), normally built every three hours ----------------
      # The doc build is the heavy part of this job, and the mathematics only changes on
      # pushes to TauCeti/ (never on the web/-only pushes that trigger this workflow), so the
      # generated HTML is cached under a run-specific key and reused on web-only runs.

      # The daily dependency updater advances the root Mathlib manifest independently of this
      # nested project. Copy its exact resolved pins into the nested manifest before computing the
      # docs cache key. Do not use `lake update` here: TauCeti normally nominates Mathlib's moving
      # `master` branch, so an independent update could select a commit newer than main's lockfile.
      # Elan and Lake find the root toolchain by walking to the parent, but Mathlib's cache executable
      # reads `lean-toolchain` from its current directory. Give it a symlink, not another copy that
      # can drift.
      - name: Synchronize the docs dependencies with TauCeti
        working-directory: docbuild
        run: |
          if [ -e lean-toolchain ] || [ -L lean-toolchain ]; then
            echo "::error title=Unexpected docs toolchain::docbuild/lean-toolchain must be generated as a link to the root toolchain"
            exit 1
          fi
          ln -s ../lean-toolchain lean-toolchain
          python3 sync_manifest.py

      # Restore-only avoids the automatic post-job re-upload that plain actions/cache does
      # on runs that merely reused the docs. The save below runs only after an actual rebuild.
      - name: Restore the generated API docs
        id: docs-cache
        uses: actions/cache/restore@v4
        with:
          path: docbuild/.lake/build/doc
          key: docs-html-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            docs-html-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-

      # Rebuild on the three-hour schedule / manual dispatch, or whenever no cached docs exist at
      # all (e.g. the first run after this workflow lands) so /docs is never missing for long.
      - name: Decide whether to (re)build the API docs
        id: docs-plan
        env:
          EVENT: ${{ github.event_name }}
          MATCHED: ${{ steps.docs-cache.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ -z "$MATCHED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # The docs build compiles the whole library, which dominates this workflow.
      # ci.yml publishes the library's oleans, and ci.yml and pr-build.yml already
      # restore them. Restore into the root project rather than docbuild: a path
      # dependency builds in its own directory.
      - name: Configure the Lake artifact cache (no-op unless the public endpoints are set)
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          if [ -n "$PUBLIC_ARTIFACT_ENDPOINT" ] && [ -n "$PUBLIC_REVISION_ENDPOINT" ]; then
            {
              echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache"
              echo "LAKE_ARTIFACT_CACHE=true"
              echo "LAKE_RESTORE_ARTIFACTS=true"
              echo "TAUCETI_CACHE_ENABLED=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Lake artifact cache enabled - restoring TauCeti's oleans for the docs build"
          else
            echo "::notice::Lake artifact cache not configured - the docs build will compile TauCeti from scratch"
          fi

      - name: Restore TauCeti's oleans from the public artifact cache
        if: ${{ steps.docs-plan.outputs.build == 'true' && env.TAUCETI_CACHE_ENABLED == '1' }}
        # The job's default working directory is web/; this script lives at the root.
        working-directory: ${{ github.workspace }}
        # A cache is an optimisation and must not be able to break the deploy. The script
        # already treats a miss as non-fatal and falls back to compiling from scratch;
        # this extends that to the script failing outright, which is how a mistake here
        # cost a whole run.
        continue-on-error: true
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: bash scripts/lake-cache-get.sh .

      - name: Fetch Mathlib oleans (docs project)
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        run: lake exe cache get

      # The generated docbuild/lean-toolchain symlink resolves to TauCeti's root toolchain, so
      # there is no second independently pinned copy to drift. The pinned doc-gen4 source still
      # uses Lean internals, though, and may need updating after a Lean bump. Compile it on its own
      # first so an incompatibility fails in minutes rather than near the end of the full build.
      - name: Verify doc-gen4 is compatible with TauCeti's toolchain
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        run: lake build doc-gen4

      # doc-gen4 documents a library's root modules and their closure; TauCeti's root is empty
      # by design, so we regenerate a throwaway aggregator root that imports the whole glob.
      - name: Generate the docs aggregator root
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        run: python3 mk_docs_root.py

      # Render pages for only the TauCeti.* modules; references to Mathlib (and Lean core) link
      # out to the hosted mathlib4_docs via its /find resolver. Start from a clean doc tree so
      # pages for deleted modules do not linger (this step never runs on the web-only reuse
      # path, which keeps the restored cache).
      - name: Build the API documentation (doc-gen4)
        if: steps.docs-plan.outputs.build == 'true'
        working-directory: docbuild
        env:
          DOCGEN_LOCAL_MODULE_ROOTS: TauCeti
          DOCGEN_DEPS_DOCS_URL: https://leanprover-community.github.io/mathlib4_docs
          # The restore above placed what this needs, so do not reach for a remote cache.
          LAKE_NO_CACHE: "true"
        run: |
          rm -rf .lake/build/doc .lake/build/doc-data
          lake build TauCetiDocs:docs

      # Stamp the tree with the commit it was generated from, BEFORE it is cached, so the
      # provenance travels with the tree wherever it is later restored. This is what makes the
      # `docgen` branch trustworthy: the branch follows the marker of the tree that was actually
      # deployed, rather than `github.sha` of whichever run happened to deploy it.
      - name: Record the commit the API docs were generated from
        if: steps.docs-plan.outputs.build == 'true'
        # This job's default working directory is `web/`; like every other step that touches the
        # docs project, this one runs in `docbuild/` instead.
        working-directory: docbuild
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker=.lake/build/doc/SOURCE_SHA
          # The name must be ours alone. If doc-gen4 ever emits anything at that path, silently
          # overwriting it would corrupt the documentation, and trusting it would let a generated
          # file dictate where the docgen branch points.
          if [ -e "$marker" ] || [ -L "$marker" ]; then
            echo "::error title=SOURCE_SHA is taken::doc-gen4 produced an entry at $marker; the provenance marker needs another name"
            exit 1
          fi
          printf '%s\n' "$SHA" > "$marker"

      - name: Save the generated API docs
        if: steps.docs-plan.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build/doc
          key: docs-html-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}

      # Two projects on two toolchains, so two caches rather than one. web/ is pinned by its own
      # committed lean-toolchain and manifest. web/examples has neither: both are generated from
      # the ROOT pins several steps below, i.e. after this step runs, so naming them here hashed
      # nothing and the key moved only when web/'s own pins did. A root toolchain bump therefore
      # left the key unchanged and restored an examples tree built under the PREVIOUS root
      # toolchain -- which is how run 35958213514 failed to link `web` with `undefined symbol:
      # lean_inc_ref_huge_n`, from an MD4Lean object compiled under v4.34.0-rc2 (the root's Lean)
      # and linked by v4.32.0 (web/'s). Key the examples tree on the pins it is actually derived
      # from, and give it no restore-keys: when those pins change, every artifact in that tree has
      # to be rebuilt anyway, so a prefix fallback restores nothing useful and risks exactly the
      # mismatch above. The `v2` discards the entries poisoned before this fix.
      - name: Cache Lake builds (site)
        uses: actions/cache@v4
        with:
          path: web/.lake
          key: web-lake-v2-${{ runner.os }}-${{ hashFiles('web/lake-manifest.json', 'web/lean-toolchain') }}
          restore-keys: web-lake-v2-${{ runner.os }}-

      - name: Cache Lake builds (examples)
        uses: actions/cache@v4
        with:
          path: web/examples/.lake
          key: web-examples-lake-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Run 35812845983 failed here with `unable to open output file .../Anchors.c.o.export:
      # 'Operation not permitted'` while compiling into the restored tree. Run 35812919873
      # restored the SAME cache entry and succeeded, because it needed no rebuild -- so the
      # failure happens only when those objects have to be recompiled, which is the same
      # intermittency the artifact-cache leak had. Why a restored file is unwritable is not
      # established; that it is, is. Restoring write permission costs milliseconds and removes
      # the error whatever put it there, which is worth more than a theory about which.
      - name: Make the restored Lake trees writable
        working-directory: ${{ github.workspace }}
        run: |
          for tree in web/.lake web/examples/.lake; do
            [ -d "$tree" ] && chmod -R u+w "$tree"
          done
          exit 0

      # web/examples has no committed Lake manifest and no committed toolchain: the manifest is
      # derived from the root pins here, and elan finds the root lean-toolchain by walking up. So
      # this project builds the library at exactly the root's Lean and Mathlib, and a bump has
      # nothing extra to carry -- see scripts/sync_web_pins.py for why that matters.
      - name: Derive the examples project's Lake manifest from the root pins
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync_web_pins.py

      - name: Fetch Mathlib oleans (examples project)
        working-directory: web/examples
        run: lake exe cache get

      - name: Build examples project (checks the showcased TauCeti theorems)
        working-directory: web/examples
        env:
          # GITHUB_ENV carries the cache settings into every later step, and this is a
          # different project.
          LAKE_NO_CACHE: "true"
          # ...but LAKE_NO_CACHE alone does not do it, which is what made this so persistent.
          # In Lake it means only "do not download build caches for packages"
          # (Lake/Config/Env.lean); the artifact cache is these three, so all three kept the
          # values the docs step wrote into GITHUB_ENV and this project went on sharing the docs
          # build's cache. Clearing them is Lake's own off switch: the environment is read ahead
          # of any package configuration, `false` is an accepted off value, and a set-but-empty
          # LAKE_CACHE_DIR reads as "no system cache".
          LAKE_ARTIFACT_CACHE: "false"
          LAKE_RESTORE_ARTIFACTS: "false"
          LAKE_CACHE_DIR: ""
        # The default target type-checks the showcased theorems. The site's nested call is
        # `lake build :examples`, a different target -- the SubVerso extraction -- so build it
        # here as well: when extraction breaks, it then fails in this step, under its own name,
        # instead of inside Verso elaboration two steps later.
        run: |
          lake build
          lake build :examples

      - name: Build site (extracts the checked snippets, compiles Verso)
        env:
          # Same reason as the examples build above, and easy to miss: this step builds web/, but
          # elaborating Site/Front.lean runs `{leanExampleProject frontExamples "examples"}`, which
          # shells out to a NESTED `lake build :examples` inside web/examples. That nested build
          # inherits this step's environment, so without this the artifact-cache settings GITHUB_ENV
          # carries from the docs build reach a third project, and Lake fails with `failed to cache
          # artifact: no such file or directory` on subverso-extract -- taking Site.Front, the site,
          # and the whole deploy with it. Setting it on the examples step alone was not enough,
          # because the site re-enters that project through SubVerso.
          #
          # This only bites when subverso-extract actually has to be recompiled: when the restored
          # web-lake cache already holds one built for the current root toolchain, the nested build
          # has nothing to cache and the leak is harmless. That is why it presented as a roughly
          # every-other-run failure rather than a consistent one.
          LAKE_NO_CACHE: "true"
          # Cleared for the same reason, and this step is where it mattered most: the nested
          # `lake build :examples` inherits the environment set here.
          LAKE_ARTIFACT_CACHE: "false"
          LAKE_RESTORE_ARTIFACTS: "false"
          LAKE_CACHE_DIR: ""
        run: lake build

      - name: Generate static site
        run: lake exe web --output _out

      # Place the doc-gen4 output (fresh from this run, or restored from the latest cache) at
      # /docs inside the site artifact. deploy-pages replaces the whole site each time, so the
      # docs must ride along in every deploy — hence the cache that keeps them available on
      # runs that did not rebuild them.
      # A missing doc tree is ALWAYS fatal here, whether or not this run planned a rebuild.
      #
      # A Pages deployment replaces the whole site, so deploying without `/docs` deletes the live
      # documentation — which breaks the `docgen` invariant even though no ref moves. The decision is
      # made from the filesystem rather than from `cache-matched-key`, because that key reports what
      # the cache *claimed*, not what was restored. There is no legitimate path here with no tree: a
      # genuine cache miss sets `build=true` (see `docs-plan`) and the docs are built, so an absent
      # tree means either that build produced nothing or a hit restored nothing, and both deserve to
      # stop the deploy.
      - name: Fold the API docs into the site under /docs
        id: fold
        run: |
          if [ ! -d ../docbuild/.lake/build/doc ]; then
            echo "::error title=API docs missing::no doc tree to deploy; refusing to publish a site without /docs, which would delete the live documentation"
            exit 1
          fi
          rm -rf _out/docs
          cp -a ../docbuild/.lake/build/doc _out/docs
          if [ ! -s _out/docs/index.html ]; then
            echo "::error title=API docs are empty::the doc tree has no index.html, so /docs would deploy unusable"
            exit 1
          fi
          # The marker rides inside the tree, so it is there whether the docs were just built or
          # restored from cache. An unmarked tree is FATAL rather than a warning: deploying one would
          # replace the live documentation with something whose provenance is unknown, leaving the
          # branch naming a commit that is no longer published and no way to notice. The cache key
          # namespace was bumped alongside this, so no pre-existing cache can supply one; a miss
          # therefore rebuilds and stamps.
          if [ ! -s _out/docs/SOURCE_SHA ]; then
            echo "::error title=API docs have no provenance::the doc tree carries no SOURCE_SHA, so the commit it documents is unknown; refusing to deploy it"
            exit 1
          fi
          # Validated as BYTES, against the exact form this workflow writes.
          #
          # Reading the file into a shell variable and matching a regex is not enough on its own:
          # command substitution silently drops NUL bytes, so forty hex characters followed by a NUL
          # arrives as a perfectly valid sha. Rendering the parsed value back into canonical form and
          # comparing the raw bytes catches that, along with CRLF, a BOM, and any trailing junk --
          # whatever is on disk must be exactly `<sha>\n` and nothing else.
          #
          # A symlink is refused outright: both this read and the Pages uploader follow one, so a
          # link left in a cached tree could point the branch at whatever it resolved to at upload
          # time rather than at what was read here.
          marker=_out/docs/SOURCE_SHA
          if [ -L "$marker" ] || [ ! -f "$marker" ]; then
            echo "::error title=SOURCE_SHA is not a regular file::refusing to read provenance through a link or special file"
            exit 1
          fi
          sha=$(< "$marker")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || ! printf '%s\n' "$sha" | cmp -s - "$marker"; then
            echo "::error title=API docs have a malformed SOURCE_SHA::the marker is not exactly one 40-character commit sha followed by a newline"
            exit 1
          fi
          echo "docs-source-sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'deploying /docs generated from %s\n' "$sha"

      # Saved only once the tree has passed every check in the fold step above, so what the
      # fallback job can restore is by construction a site that was fit to deploy: it has /docs,
      # an index, and a well-formed SOURCE_SHA. Run-specific key, prefix restore, same shape as
      # the pr-snapshot and docs caches.
      - name: Save the built site for the fallback path
        # Never allowed to fail this job. A cache-service hiccup would otherwise turn a site
        # that built perfectly into a failed build-site, skip the primary upload, and hand the
        # deploy to the fallback -- publishing an OLDER site because the cache write for the
        # newer one did not go through.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: web/_out
          key: site-out-v1-${{ github.run_id }}

      # Distinct artifact names for the two producers. upload-artifact v4 artifacts are
      # immutable and unique per name within a run, and the fallback runs precisely when the
      # primary reported failure -- which includes the case where the upload finalized and then
      # failed. Sharing the default `github-pages` name would make the fallback collide with a
      # half-finished artifact instead of publishing.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-primary
          path: web/_out

  # Publish the freshly generated DATA even when the site itself will not compile.
  #
  # A Pages deployment replaces the entire site, so there is no way to push a new
  # pipeline-health.json without publishing a whole site alongside it. What this job publishes is
  # therefore the last site that built successfully, with this run's data laid over the top. The
  # prose and the API docs are then as old as the last good build, while everything anyone polls
  # -- pipeline-health.json, the charts -- is current.
  #
  # This is the same bargain the data steps already make in build-data ("a GitHub hiccup should
  # cost a stale chart, not the whole deploy"), applied one level up: a Verso error should cost
  # stale prose, not a monitor that has been blind for a day. It is deliberately NOT silent --
  # report-data-freshness fails the run whenever this path is taken, because a site that cannot
  # build is a real problem and this job is precisely what would otherwise hide it.
  fallback-site:
    needs: [build-data, build-site]
    # `failure`, not `!= success`. A `skipped` build-site means the graph did not reach it, and
    # an unexplained skip must not authorize publishing an old site over the live one. And
    # `!cancelled()`, so cancelling the run stops here rather than deploying on the way out.
    if: ${{ !cancelled() && needs.build-site.result == 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      # Which cached site was republished. report-data-freshness compares it against this run's
      # own key, because "the site could not be built" and "the site built and then the upload
      # failed" publish very different pages and deserve different error text.
      restored-key: ${{ steps.last-good.outputs.cache-matched-key }}
    steps:
      - name: Restore the last site that built
        id: last-good
        uses: actions/cache/restore@v4
        with:
          path: web/_out
          # Normally a miss -- this run's own entry exists only if build-site got as far as saving
          # one and then failed at the upload, in which case restoring it is exactly right. The
          # prefix is what does the work on every other path.
          key: site-out-v1-${{ github.run_id }}
          restore-keys: site-out-v1-

      # No cached site means there is nothing to publish: deploying an empty tree would replace the
      # live site with nothing, which is far worse than leaving yesterday's data up. Refuse instead.
      - name: Refuse to publish without a cached site
        if: steps.last-good.outputs.cache-matched-key == ''
        run: |
          echo "::error title=No fallback site available::the site build failed and no previous build is cached, so this run cannot publish anything"
          exit 1

      - name: Lay this run's data over it
        id: overlay
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-data
          # `static "static" ← "static_files"` in web/Main.lean: the generated assets are served
          # from /static, so that is where they have to land in the built tree.
          path: web/_out/static

      # Both halves stale is not worth a deploy: it would republish the cached site unchanged and
      # report success, which is indistinguishable from having done something useful.
      - name: Refuse to publish a fallback with no fresh data
        if: steps.overlay.outcome != 'success'
        run: |
          echo "::error title=Nothing fresh to publish::the site build failed and no site-data artifact was produced, so the fallback would republish the cached site unchanged"
          exit 1

      # Checked rather than assumed: the cache key namespace is shared with entries written before
      # this job existed, and publishing a tree without /docs deletes the live API documentation.
      # The same checks the fold step applies on the primary path, for the same reason: this
      # tree is about to replace the live site, and where it came from does not change what it
      # has to satisfy. A cached entry can predate any of these rules.
      - name: Check the cached site is fit to publish
        run: |
          if [ ! -s web/_out/index.html ]; then
            echo "::error title=Cached site has no index::refusing to publish a tree with no front page"
            exit 1
          fi
          if [ ! -s web/_out/docs/index.html ]; then
            echo "::error title=Cached site has no usable /docs::refusing to publish it, which would delete the live documentation"
            exit 1
          fi
          # Validated as bytes against the exact form the fold step writes, and refusing a
          # symlink, exactly as there -- see that step for why command substitution alone is
          # not enough.
          marker=web/_out/docs/SOURCE_SHA
          if [ -L "$marker" ] || [ ! -f "$marker" ]; then
            echo "::error title=SOURCE_SHA is not a regular file::refusing to read provenance through a link or special file"
            exit 1
          fi
          sha=$(< "$marker")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || ! printf '%s\n' "$sha" | cmp -s - "$marker"; then
            echo "::error title=Cached site has a malformed SOURCE_SHA::the marker is not exactly one 40-character commit sha followed by a newline"
            exit 1
          fi
          printf 'republishing the site built from %s with this run data\n' "$sha"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-fallback
          path: web/_out

  deploy:
    needs: [build-site, fallback-site]
    # Exactly one of the two uploads an artifact, and `deploy-pages` publishes whichever one did.
    # Skipped only when neither produced anything, which is the case where there is genuinely
    # nothing to publish.
    if: ${{ !cancelled() && (needs.build-site.result == 'success' || needs.fallback-site.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Whichever producer succeeded. Exactly one of them uploaded, and the `if` above is
          # what guarantees that at least one did.
          artifact_name: ${{ needs.build-site.result == 'success' && 'github-pages-primary' || 'github-pages-fallback' }}

  # Fail the run when a generated data asset could not be regenerated, without having stopped the
  # deploy. The two are genuinely different questions and were previously collapsed into one: the
  # steps that build the charts and pipeline-health.json swallow their failures on purpose, so
  # that a GitHub hiccup costs a stale chart rather than a whole missed site publish. What was
  # missing is the other half. A warning annotation notifies nobody, so the PR-statistics step
  # failed on every run for two days, pipeline-health.json was never published at all, and every
  # run was green. Running after `deploy` keeps the site publishing while making the run red, and
  # a red scheduled run is what stuck_alerts.py's failing-scheduler detector watches for.
  # Data can go stale two independent ways, and this job reports both. A generator can fail, which
  # is what it was originally written for. Or every generator can succeed and the results never get
  # published, which is what happened across 2026-09-22: pipeline-health.json was derived cleanly on
  # four consecutive runs and discarded each time because Site.Front would not compile, so the
  # published copy aged past twenty-four hours while each of those runs reported only a warning. The
  # remedies differ -- a broken generator versus a broken publish path -- so they are separate errors.
  report-data-freshness:
    needs: [build-data, build-site, fallback-site, deploy]
    # ALWAYS, unconditionally. The previous `always() && ...data-failures != ''` reads like "always"
    # but is not: it decided whether to run by asking only whether a generator had failed, so the
    # case above -- generators all green, nothing published -- skipped this job every time. Whether
    # there is anything worth reporting is a question for the step, which can see the deploy result.
    # It is not a question the `if:` has the information to answer.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report what is serving stale data
        env:
          ASSETS: ${{ needs.build-data.outputs.data-failures }}
          DATA_RESULT: ${{ needs.build-data.result }}
          SITE_RESULT: ${{ needs.build-site.result }}
          FALLBACK_RESULT: ${{ needs.fallback-site.result }}
          RESTORED_KEY: ${{ needs.fallback-site.outputs.restored-key }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          stale=0
          if [ "$DATA_RESULT" != "success" ]; then
            echo "::error title=Data generation did not finish::the build-data job ended '${DATA_RESULT}', so nothing was regenerated this run"
            stale=1
          elif [ -n "$ASSETS" ]; then
            echo "::error title=Stale site data::these could not be regenerated and are now serving whatever was published last: ${ASSETS}"
            stale=1
          fi
          # Fresh data that never reached the site is just as stale to everyone reading it.
          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error title=Nothing was published::build-site ended '${SITE_RESULT}' and deploy ended '${DEPLOY_RESULT}', so the site still serves an earlier run's data, however old that is"
            stale=1
          elif [ "$SITE_RESULT" != "success" ]; then
            # The data is current either way, so this is not a freshness failure -- but the run
            # must still go red, because a site that cannot compile is exactly the condition the
            # fallback exists to paper over, and papering over it silently is how it went
            # unnoticed for nine days. Which pages actually got published depends on which cache
            # the fallback found, so report that rather than assuming the worse of the two.
            if [ "$RESTORED_KEY" = "site-out-v1-${GITHUB_RUN_ID}" ]; then
              echo "::error title=Recovered by the fallback::build-site ended '${SITE_RESULT}' after its site was built and cached, so the published pages ARE this run's; the upload or a later step is what failed"
            else
              echo "::error title=Published from the fallback::build-site ended '${SITE_RESULT}'; the data is current but the site's own pages are whatever the last successful build produced (${RESTORED_KEY:-unknown cache})"
            fi
            stale=1
          fi
          if [ "$stale" = "0" ]; then
            echo "every data asset regenerated, and the site deployed"
            exit 0
          fi
          exit 1

  # Point `docgen` at the commit whose documentation is now live.
  #
  # The candidate is the marker carried inside the deployed doc tree, NOT `github.sha`. Those differ
  # whenever a deploy reuses cached documentation, which is the normal path for a `web/`-only push --
  # and taking `github.sha` there would assert that documentation exists for a commit that was never
  # documented. Following the marker also lets the branch heal: every successful deploy from `main`
  # ATTEMPTS to move it to whatever is published, in either direction, so drift is corrected rather
  # than persisting until someone notices. Only attempts, though -- this job can fail, and a manual
  # dispatch from another branch deploys while skipping it entirely, so drift outlives both.
  #
  # Nothing here keys on whether a rebuild was *planned*: that is decided before anything is built
  # and says nothing about what ended up published, whereas the marker records the outcome, which is
  # the question the branch is actually answering.
  #
  # The branch is BEST-EFFORT, not exact. Publishing to Pages and updating a git ref are separate
  # operations that cannot be made atomic, so between the site being replaced and this job running,
  # `docgen` names documentation that is already gone; if this job then fails, it stays wrong until
  # the next deploy repairs it. Anything that needs certainty should read `/docs/SOURCE_SHA` from
  # the deployed site, which is the only value that is true at the moment it is read.
  # A fallback deploy skips this job, because it needs `build-site` and `build-site` failed.
  # That is right in the ordinary fallback case: the republished tree is the docs from the last
  # successful build, which is exactly where `docgen` already points. In the narrow case where
  # the fallback restored THIS run's own cache, the published docs are newer than the branch and
  # it lags by one run -- which the best-effort note above already covers, and which the next
  # successful deploy repairs.
  advance-docgen-ref:
    needs: [build-site, deploy]
    if: needs.build-site.outputs.docs-source-sha != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the docgen branch at the documented commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.build-site.outputs.docs-source-sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          endpoint="repos/$REPO/git/refs/heads/docgen"

          # The candidate must be a commit on this repository's mainline. Checked FIRST, before the
          # branch is even read, so it applies equally to creating the branch, to leaving it
          # unchanged, and to moving it -- an unrelated commit must never be installed just because
          # the branch happened to be absent or already wrong.
          #
          # Direction matters: `compare/A...B` reports how B stands relative to A, so asking for
          # CANDIDATE...DEFAULT and requiring ahead|identical is asking "does the default branch
          # contain the candidate". A candidate that is not in the repository at all fails the call,
          # which `|| echo unknown` turns into a refusal rather than a crash.
          rel=$(gh api "repos/$REPO/compare/$CANDIDATE...$DEFAULT_BRANCH" --jq .status || echo unknown)
          case "$rel" in
            ahead|identical) ;;
            *)
              echo "::error title=documented commit is not on the mainline::$CANDIDATE compares '$rel' to $DEFAULT_BRANCH; refusing to point docgen at it"
              exit 1 ;;
          esac

          current=$(gh api "repos/$REPO/git/matching-refs/heads/docgen" \
            --jq '.[] | select(.ref == "refs/heads/docgen") | .object.sha')

          if [ -z "$current" ]; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref='refs/heads/docgen' \
              -f sha="$CANDIDATE" > /dev/null
            echo "docgen created at $CANDIDATE"
            exit 0
          fi

          if [ "$current" = "$CANDIDATE" ]; then
            echo "docgen already points to $CANDIDATE"
            exit 0
          fi

          # Whether this is a fast-forward is a question the API answers, so ask it rather than
          # parsing the CLI's English error text: a reworded message or a change of output stream
          # would silently turn a legitimate rewind into a failure, leaving the branch stale after
          # the site had already been replaced.
          #
          # `docgen` is a POINTER TO CURRENT STATE, not an append-only history: it answers "which
          # commit's documentation is live". Once this run has replaced the site, a branch left
          # anywhere but the deployed commit names documentation that is no longer published, so a
          # rewind is not a hazard to avoid but the correct repair -- and it is how the branch
          # recovers from having been set ahead of reality. It is guarded by the mainline check
          # above, so it can only ever move to a commit the default branch contains.
          step=$(gh api "repos/$REPO/compare/$current...$CANDIDATE" --jq .status || echo unknown)
          case "$step" in
            ahead)
              force=false ;;
            behind|diverged)
              force=true
              echo "::warning title=docgen rewound::$current is not an ancestor of the deployed commit ($step); pointing docgen back to what is actually live" ;;
            *)
              echo "::error title=cannot compare docgen with the deployed commit::got '$step'"
              exit 1 ;;
          esac

          gh api --method PATCH "$endpoint" -f sha="$CANDIDATE" -F force="$force" > /dev/null
          echo "docgen moved $current -> $CANDIDATE (force=$force)"
