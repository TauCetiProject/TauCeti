name: pick-runner

# Selects dedicated fleet capacity for initial bors staging attempts, or chooses between
# GitHub-hosted runners and Namespace for ordinary builds. Called by pr-build.yml and
# nightly-verify.yml; callers interpret the explicit fleet/github outputs in their runs-on.
#
# Both selectors run on GitHub, avoiding Namespace build queues before fleet selection.
# They can still wait for a GitHub slot when all hosted capacity is occupied.
# FLEET_CI_ENABLED, a complete configured-group inventory, and an online idle matching
# runner are required for fleet=true. Disabled routing, missing credentials, unavailable
# capacity and subsequent staging attempts retain Namespace. Selection reserves no slot.
#
# Ordinary placement first tries the existing state service's complete organization
# capacity snapshot when its scoped token is configured. It must match this organization,
# be at most 60 seconds old and remain within its validity period. A missing token or
# unusable snapshot falls back to direct counting. A valid snapshot needs no direct
# GitHub inventory requests or quota preflight, and uses the same hosted budget below.
#
# The free plan permits 20 concurrent GitHub-hosted jobs across the organization.
# Standard hosted runners are free for public repositories; Namespace bills its runners.
# Count running hosted jobs, excluding Namespace and self-hosted runners. Both selectors
# occupy a hosted slot; a cached observation can predate their start. Builds choose GitHub
# at or below vars.HOSTED_RUNNER_BUDGET (default 18; production uses 12).
# Concurrent selectors can choose the same remaining capacity, and cached observations
# widen that race. Headroom also preserves capacity for short control jobs. No capacity
# is reserved or transferred when a selector finishes; GitHub makes actual assignments.
#
# Direct discovery preserves vars.PICKER_API_RESERVE (default 1500) for App automation
# and vars.PICKER_REPOSITORY_API_RESERVE (default 250) for the repository token, which
# also publishes required CI statuses. Failure to complete direct discovery selects
# Namespace. Missing picker outputs also retain Namespace; continue-on-error prevents
# a picker failure from stopping the caller's build.

on:
  workflow_call:
    inputs:
      fleet-staging:
        type: boolean
        required: false
        default: false
    secrets:
      # Optional. The App's installation token has a far larger hourly API budget than
      # `github.token`, which pr-build.yml's volume would exhaust. Without it, the picker
      # uses `github.token`.
      FLEET_READ_TOKEN: { required: false }
      # Optional scoped state-service bearer token; absent means direct discovery.
      TAUCETI_GITHUB_STATE_TOKEN: { required: false }
      APP_ID: { required: false }
      APP_PRIVATE_KEY: { required: false }
    outputs:
      fleet:
        description: "true only for an initial bors attempt with ready dedicated capacity"
        value: ${{ jobs.pick.outputs.fleet }}
      github:
        description: "`true` when the caller should run on a GitHub-hosted runner"
        value: ${{ jobs.pick.outputs.github }}
      busy:
        description: "GitHub-hosted jobs counted busy, when the count completed (for CI telemetry)"
        value: ${{ jobs.pick.outputs.busy }}
      budget:
        description: "the HOSTED_RUNNER_BUDGET the decision used (for CI telemetry)"
        value: ${{ jobs.pick.outputs.budget }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      fleet: ${{ steps.fleet.outputs.fleet }}
      github: ${{ steps.pick.outputs.github }}
      busy: ${{ steps.pick.outputs.busy }}
      budget: ${{ steps.pick.outputs.budget }}
    steps:
      - name: Checkout workflow-pinned fleet selector
        if: inputs.fleet-staging
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tauceti.toml
            scripts/fleet_runner.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare pinned shared tools
        if: inputs.fleet-staging
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@ad4e955b398d1419b0931e3c825a925f1c6a6e9b
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: ad4e955b398d1419b0931e3c825a925f1c6a6e9b
          project-directory: .
      - name: Prefer ready dedicated capacity for bors
        id: fleet
        if: inputs.fleet-staging
        env:
          FLEET_CI_ENABLED: ${{ vars.FLEET_CI_ENABLED }}
          FLEET_RUNNER_GROUP_ID: ${{ vars.FLEET_RUNNER_GROUP_ID }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: python3 scripts/fleet_runner.py
      - name: Check for the App
        if: ${{ !inputs.fleet-staging }}
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: echo "present=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Every repository in the organisation is public, so reading its Actions runs needs no
      # permission beyond metadata.
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        if: ${{ !inputs.fleet-staging && steps.app.outputs.present == 'true' }}
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Count busy GitHub-hosted jobs
        if: ${{ !inputs.fleet-staging }}
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_STATE_TOKEN: ${{ secrets.TAUCETI_GITHUB_STATE_TOKEN }}
          CAPACITY_REPOSITORY: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          BUDGET: ${{ vars.HOSTED_RUNNER_BUDGET || '18' }}
          API_RESERVE: ${{ steps.app-token.outputs.token && (vars.PICKER_API_RESERVE || '1500') || (vars.PICKER_REPOSITORY_API_RESERVE || '250') }}
          REPOSITORY_API_RESERVE: ${{ vars.PICKER_REPOSITORY_API_RESERVE || '250' }}
        run: |
          set -uo pipefail
          decide() {
            echo "github=$1" >> "$GITHUB_OUTPUT"
            echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
            echo "busy=${busy:-}" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          api() { timeout 30 gh api "$@"; }

          case "$BUDGET" in ''|*[!0-9]*) decide false "HOSTED_RUNNER_BUDGET='$BUDGET' is not a number: using Namespace." ;; esac

          case "$API_RESERVE" in ''|*[!0-9]*|?????????*) decide false "Invalid picker API reserve: using Namespace." ;; esac
          case "$REPOSITORY_API_RESERVE" in ''|*[!0-9]*|?????????*) decide false "Invalid repository API reserve: using Namespace." ;; esac
          api_pool=installation
          [ "$GH_TOKEN" != "$FALLBACK_TOKEN" ] || api_pool=repository
          quota_available() {
            remaining=$(api rate_limit --jq .resources.core.remaining) || return 1
            case "$remaining" in ''|*[!0-9]*) return 1 ;; esac
            if [ "$remaining" -le "$((10#$API_RESERVE + $1))" ] \
                && [ -n "$FALLBACK_TOKEN" ] && [ "$GH_TOKEN" != "$FALLBACK_TOKEN" ]; then
              # Preserve the review App's reserve without giving up idle hosted capacity.
              # Export the replacement so parallel child gh processes use the same token.
              export GH_TOKEN="$FALLBACK_TOKEN"
              API_RESERVE="$REPOSITORY_API_RESERVE"
              api_pool=repository
              echo "Shared App quota reserve protected; checking capacity with the repository API budget." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              remaining=$(api rate_limit --jq .resources.core.remaining) || return 1
              case "$remaining" in ''|*[!0-9]*) return 1 ;; esac
            fi
            [ "$remaining" -gt "$((10#$API_RESERVE + $1))" ]
          }
          # The existing state service coalesces organization discovery. This is
          # advisory capacity; GitHub still makes the final slot assignment.
          if [ -n "${GITHUB_STATE_TOKEN:-}" ]; then
            if snapshot=$(python3 - <<'PY_SHARED'
          import json,os,time,urllib.request,urllib.parse
          repo=os.environ['CAPACITY_REPOSITORY']
          try:
              request=urllib.request.Request('https://github-state.taucetiproject.org/v1/runner-capacity?'+urllib.parse.urlencode({'repository':repo}),headers={
                  'Authorization':'Bearer '+os.environ['GITHUB_STATE_TOKEN'],
                  'User-Agent':'TauCetiWorker/1.0 (+https://github.com/TauCetiProject/TauCetiWorker)'})
              with urllib.request.urlopen(request,timeout=10) as response:
                  raw=response.read(16385)
              if len(raw)>16384:raise ValueError('oversized capacity response')
              value=json.loads(raw);now=time.time()*1000
              assert value.get('complete') is True and value.get('organization')==repo.split('/')[0]
              assert type(value.get('busy')) is int and 0<=value['busy']<=10000
              assert isinstance(value.get('observed_at'),(int,float)) and -5000<=now-value['observed_at']<=60000
              assert isinstance(value.get('retry_at'),(int,float)) and value['retry_at']>now
              print(json.dumps({k:value[k] for k in ('busy','observed_at','cached','requests')}))
          except Exception:
              raise SystemExit(1)
          PY_SHARED
            ); then
              busy=$(printf '%s' "$snapshot" | python3 -c 'import json,sys;print(json.load(sys.stdin)["busy"])')
              echo "Shared capacity observation: $snapshot" >> "$GITHUB_STEP_SUMMARY"
              if [ "$busy" -le "$BUDGET" ]; then decide true "$busy hosted jobs observed by shared discovery (budget $BUDGET): using GitHub."; fi
              decide false "$busy hosted jobs observed by shared discovery (budget $BUDGET): using Namespace."
            fi
            echo "Shared capacity unavailable; using bounded direct discovery." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Both API pools serve merge and review automation; protect the active reserve.
          quota_available 0 || decide false "Preserving the shared API quota reserve: using Namespace."

          repos=$(api --paginate "orgs/$ORG/repos?per_page=100" --jq '.[] | select(.archived | not) | .name') \
            || decide false "Could not list the repositories of $ORG: using Namespace."

          # A queued workflow may already have completed its GitHub picker and be waiting
          # for Namespace. Workflow queue depth therefore says nothing about GitHub capacity.
          # Inspect only running workflows and count their actually running GitHub jobs.
          # Queued jobs consume no slot, and excluding queued workflows avoids both stale
          # orphaned runs and one API request per job waiting on Namespace.
          # Paginate both runs and jobs: page limits must not masquerade as saturation.
          export ORG
          runs=$(printf '%s\n' "$repos" | xargs -r -P 8 -n 1 bash -c '
                   timeout 30 gh api --paginate "repos/$ORG/$0/actions/runs?status=in_progress&per_page=100" \
                     --jq ".workflow_runs[].id | \"$0 \(.)\""' | sort -u) \
            || decide false "Could not list the active runs in $ORG: using Namespace."
          # Reserve one jobs request per run before starting the parallel reads. The margin
          # also leaves room for pagination; this check is a snapshot, not a quota reservation.
          run_count=$(printf '%s\n' "$runs" | awk 'NF { n++ } END { print n + 0 }')
          quota_available "$run_count" \
            || decide false "Active-run inspection would consume the shared API quota reserve: using Namespace."
          counts=$(printf '%s\n' "$runs" | xargs -r -P 8 -n 2 bash -c '
                     timeout 30 gh api --paginate "repos/$ORG/$0/actions/runs/$1/jobs?per_page=100" --jq \
                       "[.jobs[] | select(.status == \"in_progress\")
                                 | select(any(.labels[]; startswith(\"nscloud-\") or startswith(\"namespace-profile-\")) | not)
                                 | select(any(.labels[]; . == \"self-hosted\") | not)] | length"') \
            || decide false "Could not list the jobs of the active runs in $ORG: using Namespace."
          busy=$(printf '%s\n' "$counts" | awk '{ s += $1 } END { print s + 0 }')
          # A drained API budget turns every answer into Namespace, so keep it visible.
          echo "$api_pool API requests left this hour (reserve $API_RESERVE): $(api rate_limit --jq .resources.core.remaining || echo unknown)" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ "$busy" -le "$BUDGET" ]; then
            decide true "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using GitHub."
          fi
          decide false "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using Namespace."
