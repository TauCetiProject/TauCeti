name: pick-runner

# Selects dedicated fleet capacity for initial bors staging attempts, or chooses between
# GitHub-hosted runners and Namespace for ordinary builds. Called by pr-build.yml and
# nightly-verify.yml; callers interpret the explicit fleet/github outputs in their runs-on.
#
# With fleet-staging=true, the picker runs on a small priority Namespace runner rather than
# waiting for a GitHub-hosted slot. FLEET_CI_ENABLED, a complete inventory from the configured
# runner group, and an online idle matching runner are all required to answer fleet=true.
# Disabled routing, missing credentials, unavailable capacity, and subsequent run attempts
# retain Namespace. The picker reserves no capacity; GitHub makes the actual assignment.
#
# The organisation's free plan runs at most 20 GitHub-hosted jobs at once, across every repository
# in it; the 21st sits queued until a slot frees. Standard GitHub-hosted runners are not billed for
# public repositories (the monthly minute allowance applies only to private ones), while Namespace
# bills every minute, so a build takes a GitHub slot when one is free and goes to Namespace when
# they are all taken. This stops being free if a repository goes private or a job moves to a
# GitHub "larger runner", which is billed even for public repositories.
#
# There is no API for the plan's current usage, so this counts it: every running hosted job
# in every repository of the organisation, excluding Namespace and self-hosted jobs. The picker
# for ordinary builds occupies one counted slot; its build becomes eligible after it ends. No slot is reserved
# or transferred, and another job may take the freed slot. A build goes to GitHub only while the
# count is at most `vars.HOSTED_RUNNER_BUDGET` (default 18). The budget sits below 20 for two
# reasons: pickers running at the same moment each see the same count and can all choose GitHub,
# and a slot held by an hour-long build is a slot the short label, merge and notification jobs
# cannot use. Set the variable to 20 to use every slot.
#
# The App-token path preserves `vars.PICKER_API_RESERVE` requests (default 1500) for merge
# and review automation. At the reserve, the picker tries the separate per-repository
# `github.token` budget before falling back to Namespace. Rejected or unavailable
# App inventory requests also get one complete scan with that alternative token. That repository budget also serves
# required CI status publication, so preserve `vars.PICKER_REPOSITORY_API_RESERVE` (default 250) there.
# A failed complete scan on both available credential pools answers Namespace,
# and a caller whose picker did not produce an answer at all also falls back to Namespace. The job is
# `continue-on-error`, so even a picker that crashes leaves the caller's run green: review.yml and
# auto-merge key off pr-build's overall conclusion. This job can delay a build by its own runtime
# but can never stop one.
#
# The ordinary-build picker itself needs a GitHub slot. When all 20 are taken it waits for one,
# and then answers Namespace; the budget's headroom and churn of short jobs keep that wait short.

on:
  workflow_call:
    inputs:
      fleet-staging:
        type: boolean
        required: false
        default: false
    secrets:
      # Optional. The App's installation token has a far larger hourly API budget than
      # `github.token`, which pr-build.yml's volume would exhaust. Without it, the picker
      # uses `github.token`.
      FLEET_READ_TOKEN: { required: false }
      APP_ID: { required: false }
      APP_PRIVATE_KEY: { required: false }
    outputs:
      fleet:
        description: "true only for an initial bors attempt with ready dedicated capacity"
        value: ${{ jobs.pick.outputs.fleet }}
      github:
        description: "`true` when the caller should run on a GitHub-hosted runner"
        value: ${{ jobs.pick.outputs.github }}
      busy:
        description: "GitHub-hosted jobs counted busy, when the count completed (for CI telemetry)"
        value: ${{ jobs.pick.outputs.busy }}
      budget:
        description: "the HOSTED_RUNNER_BUDGET the decision used (for CI telemetry)"
        value: ${{ jobs.pick.outputs.budget }}

jobs:
  pick:
    runs-on: >-
      ${{ inputs.fleet-staging && fromJSON(format('["nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=0","namespace-features:github.run-id={0}"]', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      fleet: ${{ steps.fleet.outputs.fleet }}
      github: ${{ steps.pick.outputs.github }}
      busy: ${{ steps.pick.outputs.busy }}
      budget: ${{ steps.pick.outputs.budget }}
    steps:
      - name: Checkout workflow-pinned fleet selector
        if: inputs.fleet-staging
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tauceti.toml
            scripts/fleet_runner.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare pinned shared tools
        if: inputs.fleet-staging
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@ad4e955b398d1419b0931e3c825a925f1c6a6e9b
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: ad4e955b398d1419b0931e3c825a925f1c6a6e9b
          project-directory: .
      - name: Prefer ready dedicated capacity for bors
        id: fleet
        if: inputs.fleet-staging
        env:
          FLEET_CI_ENABLED: ${{ vars.FLEET_CI_ENABLED }}
          FLEET_RUNNER_GROUP_ID: ${{ vars.FLEET_RUNNER_GROUP_ID }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: python3 scripts/fleet_runner.py
      - name: Check for the App
        if: ${{ !inputs.fleet-staging }}
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: echo "present=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Every repository in the organisation is public, so reading its Actions runs needs no
      # permission beyond metadata.
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        if: ${{ !inputs.fleet-staging && steps.app.outputs.present == 'true' }}
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Count busy GitHub-hosted jobs
        if: ${{ !inputs.fleet-staging }}
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          BUDGET: ${{ vars.HOSTED_RUNNER_BUDGET || '18' }}
          API_RESERVE: ${{ steps.app-token.outputs.token && (vars.PICKER_API_RESERVE || '1500') || (vars.PICKER_REPOSITORY_API_RESERVE || '250') }}
          REPOSITORY_API_RESERVE: ${{ vars.PICKER_REPOSITORY_API_RESERVE || '250' }}
        run: |
          set -uo pipefail
          telemetry=$(mktemp -d)
          trap 'rm -rf "$telemetry"' EXIT
          api_pool=installation
          [ "$GH_TOKEN" != "$FALLBACK_TOKEN" ] || api_pool=repository
          reason=unknown
          api() {
            local capture rc
            capture=$(mktemp "$telemetry/response.XXXXXX")
            # Keep only public quota headers; never dump authorization or token-bearing debug logs.
            timeout 30 gh api --include "$@" > "$capture" 2> "$capture.error"
            rc=$?
            python3 - "$capture" "$api_pool" "$rc" "$@" <<'PY'
          import json, pathlib, re, sys, time
          path=pathlib.Path(sys.argv[1]); headers=None; records=[]
          endpoint=next((a for a in sys.argv[4:] if a=='rate_limit' or a.startswith(('orgs/','repos/'))),'unknown')
          context={'pool':sys.argv[2],'exit_code':int(sys.argv[3]),'endpoint':endpoint,'at':time.time_ns()}
          allowed={'x-ratelimit-limit','x-ratelimit-remaining','x-ratelimit-reset','x-ratelimit-resource','retry-after','x-github-request-id'}
          for line in path.read_text().splitlines(keepends=True):
              if re.match(r'^HTTP/\S+ \d{3}',line):
                  headers={**context,'status':int(line.split()[1])};records.append(headers)
              elif headers is not None:
                  if not line.strip(): headers=None
                  elif ':' in line:
                      k,v=line.split(':',1)
                      if k.lower() in allowed:headers[k.lower()]=v.strip()[:200]
              else:sys.stdout.write(line)
          # Fixtures may omit headers; count the attempted call anyway.
          if not records:records=[{**context,'status':'unavailable'}]
          pathlib.Path(str(path)+'.headers').write_text('\n'.join(json.dumps(r) for r in records)+'\n')
          PY
            [ "$?" -eq 0 ] || return 1
            return "$rc"
          }
          decide() {
            local count
            count=$(cat "$telemetry"/*.headers 2>/dev/null | wc -l)
            {
              echo "$2"
              echo "reason=$reason; credential_pool=$api_pool; busy=${busy:-unknown}; budget=$BUDGET; observed_requests=$count"
              # Only quota/rejection samples are useful here; bound routine summary size.
              echo '```json'
            python3 - "$telemetry" <<'PY'
          import json,pathlib,sys
          records=sorted((json.loads(s) for p in pathlib.Path(sys.argv[1]).glob('*.headers') for s in p.read_text().splitlines()),key=lambda r:r['at'])
          selected=[r for r in records if isinstance(r.get('status'),int) and r['status']>=400]
          selected+=[r for r in records[-2:] if r not in selected]
          for r in selected[:12]:print(json.dumps(r,sort_keys=True))
          PY
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "github=$1" >> "$GITHUB_OUTPUT"
            echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
            echo "busy=${busy:-}" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$BUDGET" in ''|*[!0-9]*|?????????*) reason=invalid_budget; decide false "HOSTED_RUNNER_BUDGET='$BUDGET' is not a number: using Namespace." ;; esac
          case "$API_RESERVE" in ''|*[!0-9]*|?????????*) reason=invalid_reserve; decide false "Invalid picker API reserve: using Namespace." ;; esac
          case "$REPOSITORY_API_RESERVE" in ''|*[!0-9]*|?????????*) reason=invalid_reserve; decide false "Invalid repository API reserve: using Namespace." ;; esac
          quota_available() {
            remaining=$(api rate_limit --jq .resources.core.remaining) || { reason=quota_read_failed; return 1; }
            case "$remaining" in ''|*[!0-9]*|?????????*) reason=quota_read_failed; return 1 ;; esac
            [ "$remaining" -gt "$((10#$API_RESERVE + $1))" ] || { reason=quota_reserve; return 1; }
          }
          scan() {
            quota_available 0 || return 1
            repos=$(api --paginate "orgs/$ORG/repos?per_page=100" --jq '.[] | select(.archived | not) | .name') \
              || { reason=repository_inventory_failed; return 1; }
            # Queued workflows may already be waiting for Namespace: only running jobs count.
            # Paginate completely; partial inventories must never imply spare capacity.
            export ORG
            # Export the wrapper and its state so all parallel reads use the selected credential.
            export telemetry api_pool
            export -f api
            runs=$(printf '%s\n' "$repos" | xargs -r -P 8 -n 1 bash -c '
                     api --paginate "repos/$ORG/$0/actions/runs?status=in_progress&per_page=100" \
                       --jq ".workflow_runs[].id | \"$0 \(.)\""' | sort -u) \
              || { reason=run_inventory_failed; return 1; }
            run_count=$(printf '%s\n' "$runs" | awk 'NF { n++ } END { print n + 0 }')
            quota_available "$run_count" || return 1
            counts=$(printf '%s\n' "$runs" | xargs -r -P 8 -n 2 bash -c '
                       api --paginate "repos/$ORG/$0/actions/runs/$1/jobs?per_page=100" --jq \
                         "[.jobs[] | select(.status == \"in_progress\")
                                     | select(any(.labels[]; startswith(\"nscloud-\") or startswith(\"namespace-profile-\")) | not)
                                     | select(any(.labels[]; . == \"self-hosted\") | not)] | length"') \
              || { reason=job_inventory_failed; return 1; }
            busy=$(printf '%s\n' "$counts" | awk '{ s += $1 } END { print s + 0 }')
          }
          if ! scan; then
            # A low quota preflight, a rejected request, and an unreadable quota endpoint
            # all get the same single alternative. Restart the complete scan; discard partial counts.
            if [ -n "$FALLBACK_TOKEN" ] && [ "$GH_TOKEN" != "$FALLBACK_TOKEN" ]; then
              echo "Shared App quota reserve protected or inventory unavailable ($reason); checking capacity with the repository API budget." | tee -a "$GITHUB_STEP_SUMMARY"
              export GH_TOKEN="$FALLBACK_TOKEN"
              API_RESERVE="$REPOSITORY_API_RESERVE"
              api_pool=repository
              if ! scan; then decide false "Could not complete capacity inspection ($reason); API quota reserve remains protected: using Namespace."; fi
            else
              decide false "Could not complete capacity inspection ($reason); API quota reserve remains protected: using Namespace."
            fi
          fi
          echo "$api_pool API requests left this hour (reserve $API_RESERVE; pre-job-scan snapshot): $remaining" >> "$GITHUB_STEP_SUMMARY"
          reason=capacity_available
          if [ "$busy" -le "$BUDGET" ]; then
            decide true "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using GitHub."
          fi
          reason=capacity_busy
          decide false "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using Namespace."
