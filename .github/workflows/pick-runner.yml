name: pick-runner

# The existing dispatcher selects from one complete capacity snapshot. Machines
# advertise class, permanent machine, and ephemeral instance labels. All limits
# are approximate: concurrent pickers can observe the same free capacity.
# Full or unknown cloud capacity queues on GitHub instead of bypassing the
# Namespace cap. Picker/control jobs do not count towards the build-job cap.
# Preserve App and repository API reserves for status and merge automation.
on:
  workflow_call:
    inputs:
      fleet-staging:
        type: boolean
        default: false
      fleet-pr:
        type: boolean
        default: false
      pr-head:
        type: string
        default: ""
    secrets:
      FLEET_READ_TOKEN: { required: false }
      TAUCETI_GITHUB_STATE_TOKEN: { required: false }
      APP_ID: { required: false }
      APP_PRIVATE_KEY: { required: false }
    outputs:
      runner:
        description: JSON runs-on target, bound to this picker attempt
        value: ${{ jobs.pick.outputs.runner }}
      pool:
        value: ${{ jobs.pick.outputs.pool }}
      attempt:
        value: ${{ jobs.pick.outputs.attempt }}
      fleet:
        value: ${{ jobs.pick.outputs.fleet }}
      github:
        value: ${{ jobs.pick.outputs.github }}
      busy:
        value: ${{ jobs.pick.outputs.busy }}
      budget:
        value: ${{ jobs.pick.outputs.budget }}
      namespace_busy:
        value: ${{ jobs.pick.outputs.namespace_busy }}
      namespace_cap:
        value: ${{ jobs.pick.outputs.namespace_cap }}

jobs:
  pick:
    # Preserve the current GitHub control runner so Namespace queues cannot
    # prevent selection of available dedicated capacity.
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      pool: ${{ steps.pick.outputs.pool }}
      attempt: ${{ steps.pick.outputs.attempt }}
      fleet: ${{ steps.pick.outputs.fleet }}
      github: ${{ steps.pick.outputs.github }}
      busy: ${{ steps.pick.outputs.busy }}
      budget: ${{ steps.pick.outputs.budget }}
      namespace_busy: ${{ steps.pick.outputs.namespace_busy }}
      namespace_cap: ${{ steps.pick.outputs.namespace_cap }}
    steps:
      - name: Checkout workflow-pinned runner selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tauceti.toml
            scripts/fleet_runner.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@9b36225ee71def88ab5b2b57a3139bf11ada437b
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: 9b36225ee71def88ab5b2b57a3139bf11ada437b
          project-directory: .
      - name: Mint picker read token
        if: ${{ env.HAS_APP == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@29824b336c9c3f639e8f920a6b650a6edfb6e0e7 # v2.2.1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-actions: read
      - name: Select destination in configured preference order
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_STATE_TOKEN: ${{ secrets.TAUCETI_GITHUB_STATE_TOKEN }}
          BUDGET: ${{ vars.HOSTED_RUNNER_BUDGET || '18' }}
          NAMESPACE_BUILD_CAP: ${{ vars.NAMESPACE_BUILD_CAP }}
          API_RESERVE: ${{ steps.app-token.outputs.token && (vars.PICKER_API_RESERVE || '1500') || (vars.PICKER_REPOSITORY_API_RESERVE || '250') }}
          REPOSITORY_API_RESERVE: ${{ vars.PICKER_REPOSITORY_API_RESERVE || '250' }}
          FLEET_JOB_KIND: ${{ inputs.fleet-staging && 'staging' || inputs.fleet-pr && 'pr' || 'other' }}
          PR_HEAD: ${{ inputs.pr-head }}
          FLEET_CI_ENABLED: ${{ vars.FLEET_CI_ENABLED }}
          FLEET_RUNNER_GROUP_ID: ${{ vars.FLEET_RUNNER_GROUP_ID }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: python3 scripts/fleet_runner.py --route
