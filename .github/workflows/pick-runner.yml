name: pick-runner

# Staging tries eligible dedicated machines before cloud-capacity discovery. Machines
# advertise capacity through registered runners with class, permanent machine,
# and ephemeral instance labels. Concurrent pickers can observe the same free slot.
# Capacity observations are advisory. A partial Namespace count below its cap
# cannot establish spare capacity; unknown pools retain native GitHub fallback.
# Picker/control jobs do not count towards the build-job cap.
# Preserve the repository API reserve for status and merge automation.
on:
  workflow_call:
    inputs:
      fleet-staging:
        description: Use staging preferences and eligible dedicated machines; takes precedence over fleet-pr
        type: boolean
        default: false
      fleet-pr:
        description: Use PR preferences and eligible dedicated machines when pr-head is supplied
        type: boolean
        default: false
      pr-head:
        description: Immutable 40-character PR head; empty disables dedicated PR placement and recovery
        type: string
        default: ""
      pr-number:
        description: Ordinary PR whose manual local-test route should be checked before selection
        type: number
        default: 0
    secrets:
      SELF_TESTED_APP_ID: { required: false }
      SELF_TESTED_APP_KEY: { required: false }
      FLEET_READ_TOKEN: { required: false }
      TAUCETI_GITHUB_STATE_TOKEN: { required: false }
    outputs:
      hosted-slot:
        description: Native GitHub bulk-build concurrency slot, from 0 through 18
        value: ${{ jobs.pick.outputs.hosted-slot }}
      skip-pr-build:
        description: Eligible manual self-tested assertion for this exact PR head
        value: ${{ jobs.pick.outputs.skip-pr-build }}
      runner:
        description: JSON runs-on target; callers must match attempt to their current github.run_attempt before using runner or pool
        value: ${{ jobs.pick.outputs.runner }}
      pool:
        description: "Destination key: github, fleet, namespace, or a named machine preference; valid only for the matching attempt"
        value: ${{ jobs.pick.outputs.pool }}
      attempt:
        description: Picker's github.run_attempt; callers must compare it with their current attempt before using runner or pool
        value: ${{ jobs.pick.outputs.attempt }}
      busy:
        description: Observed running GitHub-hosted jobs, including control jobs; empty when unknown
        value: ${{ jobs.pick.outputs.busy }}
      budget:
        description: GitHub-hosted running-job budget used for this selection
        value: ${{ jobs.pick.outputs.budget }}
      namespace_busy:
        description: Observed queued or running Namespace build jobs, excluding control jobs; empty when unknown
        value: ${{ jobs.pick.outputs.namespace_busy }}
      namespace_cap:
        description: Approximate shared Namespace build-job cap used for this selection
        value: ${{ jobs.pick.outputs.namespace_cap }}

jobs:
  pick:
    # Every picker must reach the fleet without first waiting for a GitHub build slot.
    # Keep control work small, high priority, and isolated to this workflow run.
    # An operator can recover selection during a Namespace outage without a PR.
    runs-on: ${{ vars.PICKER_GITHUB_FALLBACK == 'true' && 'ubuntu-24.04' || fromJSON(format('["nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=0","namespace-features:github.run-id={0}"]', github.run_id)) }}
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      hosted-slot: ${{ steps.hosted-slot.outputs.slot }}
      skip-pr-build: ${{ steps.local-route.outputs.skip }}
      runner: ${{ steps.pick.outputs.runner }}
      pool: ${{ steps.pick.outputs.pool }}
      attempt: ${{ steps.pick.outputs.attempt }}
      busy: ${{ steps.pick.outputs.busy }}
      budget: ${{ steps.pick.outputs.budget }}
      namespace_busy: ${{ steps.pick.outputs.namespace_busy }}
      namespace_cap: ${{ steps.pick.outputs.namespace_cap }}
    steps:
      - name: Choose a native GitHub bulk-build concurrency slot
        id: hosted-slot
        env:
          HOSTED_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("slot=" + str(int(os.environ["HOSTED_RUN_ID"]) % 19), file=output)
          PYTHON
      - name: Checkout workflow-pinned runner selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tauceti.toml
            scripts/fleet_runner.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@ffc3b00f51a0c0ca0ab90730cd298d38413632ca
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: ffc3b00f51a0c0ca0ab90730cd298d38413632ca
          project-directory: .
      - name: Read the allowlist using the existing organization App
        id: team-token
        if: inputs.pr-number > 0 && (contains(github.event.pull_request.labels.*.name, 'self-tested') || github.event.label.name == 'self-tested' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.SELF_TESTED_APP_ID }}
          private-key: ${{ secrets.SELF_TESTED_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-members: read
      - name: Decide the manual PR route before runner selection
        id: local-route
        if: inputs.pr-number > 0 && (contains(github.event.pull_request.labels.*.name, 'self-tested') || github.event.label.name == 'self-tested' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_TESTED_MERGE_BACKEND: ${{ vars.MERGE_BACKEND }}
          TAUCETI_TEAM_TOKEN: ${{ steps.team-token.outputs.token }}
        run: python3 -m tauceti_tools script self_tested.py --pr '${{ inputs.pr-number }}'
      - name: Select destination in configured preference order
        if: steps.local-route.outputs.skip != 'true'
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STATE_TOKEN: ${{ secrets.TAUCETI_GITHUB_STATE_TOKEN }}
          BUDGET: ${{ vars.HOSTED_RUNNER_BUDGET || '18' }}
          NAMESPACE_BUILD_CAP: ${{ vars.NAMESPACE_BUILD_CAP }}
          API_RESERVE: ${{ vars.PICKER_REPOSITORY_API_RESERVE || '250' }}
          FLEET_JOB_KIND: ${{ inputs.fleet-staging && 'staging' || inputs.fleet-pr && 'pr' || 'other' }}
          PR_HEAD: ${{ inputs.pr-head }}
          FLEET_CI_ENABLED: ${{ vars.FLEET_CI_ENABLED }}
          FLEET_RUNNER_GROUP_ID: ${{ vars.FLEET_RUNNER_GROUP_ID }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: python3 scripts/fleet_runner.py --route
