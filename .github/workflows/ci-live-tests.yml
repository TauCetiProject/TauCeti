name: Live CI page tests
on:
  push:
    paths:
      [
        "web/static_files/ci-live.js",
        "scripts/ci_live_summary.py",
        "scripts/test_ci_live*",
        ".github/workflows/ci-live*.yml",
      ]
  pull_request:
    paths:
      [
        "web/static_files/ci-live.js",
        "scripts/ci_live_summary.py",
        "scripts/test_ci_live*",
        ".github/workflows/ci-live*.yml",
      ]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/test_ci_live_browser.mjs
      - run: python3 -m unittest scripts/test_ci_live_summary.py
