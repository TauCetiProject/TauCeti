name: Auto-merge

# Events wake one batch, rather than resolving and merging one PR per event.
# GitHub retains one running and one pending job. Changed PR metadata makes
# coalesced approvals/revocations fresh work before unchanged queue rechecks.
# Each bounded pass resumes from saved observations; it need not cover the full queue.
# The environment wait timer coalesces five minutes without occupying a runner.
# The pinned sweep preserves head/base fences, review revocations, holds, quotas,
# original repair allowances and the selected merge backend; it runs no reviewer.
on:
  pull_request_target:
    branches: [main]
    types: [synchronize, labeled]
  workflow_run:
    workflows: ["pr-build"]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    # Filter before entering the global group: unrelated labels/comments must
    # not replace the one pending batch that carries useful work.
    if: >-
      github.repository == 'TauCetiProject/TauCeti' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request_target'
          && (github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge'))
        || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request_target')
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && (contains(github.event.comment.body, 'tauceti-scoreboard')
            || contains(github.event.changes.body.from, 'tauceti-scoreboard'))))
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=0
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 30
    concurrency:
      group: auto-merge-batch
      cancel-in-progress: false
    # Configured with a five-minute wait timer and no secrets/reviewers.
    environment:
      name: control-batch-debounce
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Cone mode includes root files such as the trusted tauceti.toml.
          sparse-checkout: |
            .github/actions/checkout-merge-policy
            scripts/control_batches
      - name: Checkout the pinned merge policy (read-only)
        uses: ./.github/actions/checkout-merge-policy

      # Match the existing reusable merge-sweep's project binding and token.
      - name: Checkout pinned common configuration tools
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: a8b16c3dd0c0730a1963052cb520808e161222ef
          path: .tauceti-tools
          persist-credentials: false
      - name: Bind the trusted project configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.tauceti-tools
        run: |
          python3 -m tauceti_tools config environment --conf tauceti.toml --github-env "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Mint merge-sweep token
        id: merge-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-issues: write
          permission-workflows: write
        env:
          INPUT_PERMISSION-ACTIONS-VARIABLES: read

      # Progress only orders observations. It never supplies merge authority.
      - name: Restore batch progress
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/auto-merge-batch-progress.json
          key: auto-merge-batch-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: auto-merge-batch-v1-${{ github.repository_id }}-
      - name: Reconcile current merge candidates
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          REPO: ${{ github.repository }}
          FOCUSED: "1"
          SWEEP_PROGRESS_FILE: ${{ runner.temp }}/auto-merge-batch-progress.json
        run: python3 scripts/control_batches/merge_batch.py
      - name: Save batch progress
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/auto-merge-batch-progress.json
          key: auto-merge-batch-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
