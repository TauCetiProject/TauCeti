name: Auto-merge

# Merge a PR automatically once it is genuinely ready, WITHOUT generating any reviews here (that is
# expensive — it spends API budget — and is gated off in review.yml). Reviews are produced by people
# running tauceti-review / tauceti locally and posting a head-pinned scoreboard comment. This workflow
# reconciles the queue from the newest completed current-head scoreboard. Temporary review
# coordination comments are ignored. TauCetiData is a separate analytics archive.
#
# It calls the lightweight TauCetiReview merge-only workflow, which mints no provider keys, runs no
# reviewer, and merges only when the engine's own rule says so: build green on HEAD, every blocking
# rubric green on HEAD, every changed path under TauCeti/ (plus the allowed root files), and bump-guard
# green for any Lake-pin change. The scoreboard supplies the review verdict with no author-association
# gate; trusted CI supplies the build, scope, axiom, path, and bump-guard boundaries.
# queue-release.yml reconsiders waiting PRs when a Lake-pin reservation ends; that event does not
# change the waiting PRs' heads, builds, or comments and therefore cannot wake this workflow.

on:
  # A pushed head is immediately unsafe until it has current-head reviews.
  pull_request_target:
    types: [synchronize]
  # Head is freshly green: re-check whether this PR is now mergeable.
  workflow_run:
    workflows: ["pr-build"]
    types: [completed]
  # A completed scoreboard changed.
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Pushes and comments already identify their PR. Only a completed build whose event omits
    # the association needs a separate API lookup; ordinary events start just the policy job.
    if: >
      github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request_target'
        && !github.event.workflow_run.pull_requests[0].number
    outputs:
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  merge:
    needs: resolve
    # A skipped lookup must not skip a PR already identified by the event. Keep the original
    # event filters here, including edits/deletions that remove a scoreboard marker: review
    # revocations must reach the same pinned policy as approvals.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'pull_request_target'
        || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request_target'
          && (github.event.workflow_run.pull_requests[0].number
            || (needs.resolve.result == 'success' && needs.resolve.outputs.pr != '')))
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && (contains(github.event.comment.body, 'tauceti-scoreboard')
            || contains(github.event.changes.body.from, 'tauceti-scoreboard')))) }}
    # Pinned to a TauCetiReview commit; bump deliberately. The reusable workflow receives the App
    # secrets, so a floating @main would be a supply-chain risk.
    # Re-pin together with the other two callers and .github/actions/checkout-merge-policy
    # (scripts/test_workflow_pins.py checks they agree). The called workflow checks out its own
    # commit, supplied explicitly as review_ref.
    uses: TauCetiProject/TauCetiReview/.github/workflows/merge-only.yml@32ce2069308080df4e08df14c2160012a51c8152
    with:
      review_ref: 32ce2069308080df4e08df14c2160012a51c8152
      tools_repository: TauCetiProject/TauCetiTools
      tools_ref: a8b16c3dd0c0730a1963052cb520808e161222ef
      pr: ${{ format('{0}', github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || needs.resolve.outputs.pr) }}
      merge_backend: ${{ vars.MERGE_BACKEND || 'queue' }}
    # Pass only the App credentials merge-only needs, not all of TauCeti's secrets.
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
