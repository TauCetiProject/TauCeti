name: Rebuild on CI label changes

# Only CI policy labels dispatch pr-build. Unrelated labels skip this router
# without creating a build run or waking every pr-build workflow_run consumer.
# A self-tested assertion can supersede an existing build without allocating a
# runner; removing it, or requesting full lint, restores the ordinary build.

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  actions: write

jobs:
  rebuild:
    # While vars.FLEET_PRIORITY_LABEL names a label (empty is off), adding it rebuilds the PR so its
    # build moves to the Fleet PR priority class (TauCetiTools docs/project-setup.md); the new run
    # supersedes the PR's queued or running build. Expressions compare labels case-insensitively.
    if: >-
      (github.event.action == 'labeled' && vars.FLEET_PRIORITY_LABEL != '' &&
       github.event.label.name == vars.FLEET_PRIORITY_LABEL &&
       !contains(github.event.pull_request.labels.*.name, 'self-tested')) ||
      github.event.label.name == 'self-tested' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-lint') ||
      (contains(github.event.pull_request.labels.*.name, 'self-tested') &&
       contains(fromJSON('["full-lint", "lint-repair"]'), github.event.label.name))
    # Fleet CI pool (the class nightly-verify uses), not the backlogged GitHub-hosted pool.
    # No App private key enters this job; it holds only the workflow token.
    # Set vars.PICKER_GITHUB_FALLBACK='true' to fall back to ubuntu-24.04 without a PR.
    runs-on: ${{ (vars.FLEET_CI_ENABLED == 'true' && vars.PICKER_GITHUB_FALLBACK != 'true') && fromJSON('{"group":"TauCetiFleet","labels":["self-hosted","linux","x64","tauceti-fleet-pr"]}') || 'ubuntu-24.04' }}
    steps:
      - name: Dispatch pr-build for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL_HEAD: ${{ github.event.pull_request.head.sha }}
          MAINTENANCE: >-
            ${{ github.event.pull_request.user.type == 'Bot' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                (startsWith(github.event.pull_request.head.ref, 'bump-mathlib/') ||
                 startsWith(github.event.pull_request.head.ref, 'lint-repair/')) }}
          SKIP_BUILD: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'self-tested') &&
                !contains(github.event.pull_request.labels.*.name, 'full-lint') &&
                !contains(github.event.pull_request.labels.*.name, 'lint-repair') &&
                !startsWith(github.event.pull_request.head.ref, 'lint-repair/') }}
        run: >-
          gh workflow run pr-build.yml -R "$REPO" -f pr="$PR"
          -f skip_build="$SKIP_BUILD" -f label_head="$LABEL_HEAD" -f maintenance="$MAINTENANCE"
