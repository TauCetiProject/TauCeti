name: Queue Housekeeping

# Tidies the PR queue so the autonomous worker can stay focused on producing work.
# review.yml already auto-merges green PRs; this covers the other two janitorial jobs:
#   abandon  Close any open PR the review engine labelled `review-budget-spent` (it used its full
#            review budget without going green; the engine clears the label if a later round fixes it).
#            The branch is kept; the comment says it is fine to open a fresh PR after another look.
#   dedup    Close a newer PR that authors the same roadmap target (the <!--tauceti-target:v1 ...-->
#            body marker) as an older open one; keep the lowest PR number.
#   stale    Close a PR whose latest review scoreboard is changes-requested/blocked and that has had
#            no activity for STALE_DAYS (default 7).
# The only opt-out is a `keep` (or hold/wip/human/do-not-close) label; human activity alone does not
# spare a PR. abandon is a server-side label query (one request, independent of total open-PR count),
# and a failed close makes the job exit nonzero. Run it manually first with the dry-run input to preview.

on:
  schedule:
  - cron: "20 */2 * * *"   # every two hours, offset from the daily bump
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be closed without closing it"
        type: boolean
        default: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write

      - uses: actions/checkout@v4

      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@02db6ea51c27553cb6271e605612a56169ae72f6
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: 02db6ea51c27553cb6271e605612a56169ae72f6
          project-directory: .
      - name: Diagnose stale PR policy (one read-only batch query)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
        run: |
          python3 - <<'PY'
          import json, subprocess, datetime
          import sys
          sys.path.insert(0, "scripts/pr_status")
          import core
          numbers=[2193,8279,8282,8284,8287,8288,9112,11769]
          parts=[]
          for n in numbers:
              parts.append(f'p{n}:pullRequest(number:{n}){{number state isDraft updatedAt labels(first:30){{nodes{{name}}}} comments(first:100){{pageInfo{{hasNextPage}} nodes{{body updatedAt authorAssociation author{{login}}}}}}}}')
          query='query { repository(owner:"TauCetiProject",name:"TauCeti") {'+' '.join(parts)+'} }'
          r=subprocess.run(['gh','api','graphql','-f','query='+query],capture_output=True,text=True,check=True)
          d=json.loads(r.stdout)
          if d.get("errors"): raise RuntimeError("GraphQL diagnostic failed")
          cutoff=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=7)
          for p in d['data']['repository'].values():
              comments=p['comments']['nodes']
              boards=[c for c in comments if 'tauceti-scoreboard' in c['body']]
              rows=[dict(body=c['body'],updated=c['updatedAt'],author_association=c['authorAssociation']) for c in boards]
              trusted=core.scoreboard_meta_from([c for c in rows if c['author_association'] in core._REPO_ASSOCIATED])
              labels={x['name'].lower() for x in p['labels']['nodes']}
              proposed=(p['state']=='OPEN' and not p['isDraft'] and 'awaiting-author' in labels and not labels.intersection({'keep','hold','wip','human','on-hold','do-not-close'}) and datetime.datetime.fromisoformat(p['updatedAt'].replace('Z','+00:00'))<cutoff)
              print(json.dumps(dict(pr=p['number'],state=p['state'],updated=p['updatedAt'],scoreboard_actors=[dict(login=c['author']['login'],association=c['authorAssociation']) for c in boards],old_policy_has_trusted_scoreboard=bool(trusted),proposed_stale_eligible=proposed,more_comments=p['comments']['pageInfo']['hasNextPage'])))
          PY
