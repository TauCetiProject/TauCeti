name: pr-build
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging' && format('bors branch={0} batch={1} head={2} base={3}', github.event.client_payload.base_ref || 'unknown', github.event.client_payload.batch_id, github.event.client_payload.head_sha, github.event.client_payload.base_sha) || (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-pr-approved') && format('pr-build pr={0} head={1}', github.event.pull_request.number || github.event.client_payload.pr, github.event.pull_request.head.sha || github.event.client_payload.head_sha) || format('pr-build {0}', github.event.pull_request.number || inputs.pr || github.event.client_payload.pr || github.event.merge_group.head_sha || github.run_id) }}

# Builds a deterministic integration of immutable PR head H with main B captured once
# by the existing dispatch. Scope, review and approval remain bound to raw H and its
# merge base. Record tested commit/tree T explicitly; the status on H describes that
# integration, never claims T is raw H. Bors and native merge groups build their supplied
# frozen candidate unchanged. No main-push trigger or current-base barrier is added.
# Workflow-pinned tooling and attested Lake config remain mandatory; candidate Lean
# runs only offline under bwrap, and ordinary PR outputs never publish shared caches.
#
# The job below is deliberately NOT named `build`: GitHub Actions auto-creates a check-run named
# after the job, and a check-run named `build` would collide with the required `build` STATUS this
# job posts. Branch protection matches the required context `build` against BOTH commit statuses and
# check-runs by name, so two `build` results (a green status + a red job check-run) wedge the PR as
# BLOCKED even though the authoritative build passed — e.g. when the job's final report step exits
# nonzero on a transient "could not list files" (INFRA) hiccup while a healthy re-run posts the green
# status. Keeping the job name distinct leaves exactly one `build` (the status) as the merge gate.
#
# Live on pull_request_target (fires for all PRs, incl. forks, from the trusted base definition).
# workflow_dispatch is also kept for ad-hoc re-testing of a given PR number.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The merge queue tests a batch (one or more PRs combined onto current main) before it lands. We
  # build the COMBINED merge-group commit exactly as GitHub synthesized it and post the `build`
  # status on it so the queue's required check is satisfied. A combined diff that reaches outside
  # TauCeti/ needs exact-revision human approval through bors; the trusted harness
  # remains independent of that diff.
  merge_group:
    types: [checks_requested]
  # Bors dispatches the exact staging SHA. repository_dispatch uses this trusted
  # default-branch workflow definition, not a candidate's .github/ files. A human
  # approval also requests ordinary PR CI; that dispatch carries no authority.
  repository_dispatch:
    types: [tauceti-bors-staging, tauceti-bors-pr-approved]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build", required: true, type: string }

permissions:
  contents: read
  pull-requests: read  # workflow-pinned lint-policy GraphQL reads branches and labels
  statuses: write
  actions: read  # fence status publication against obsolete run attempts

concurrency:
  # Bors batch IDs identify one base branch. Incomplete dispatch identities use
  # the run ID so they cannot displace another candidate.
  group: >-
    pr-build-${{ github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging' && (
      github.event.client_payload.batch_id && github.event.client_payload.head_sha &&
      github.event.client_payload.base_sha && github.event.client_payload.base_ref &&
      format('bors-staging-{0}-{1}-{2}-{3}-{4}', github.repository_id, github.event.client_payload.batch_id,
        github.event.client_payload.head_sha, github.event.client_payload.base_sha, github.event.client_payload.base_ref)
      || format('bors-staging-run-{0}', github.run_id)
    ) || github.event.pull_request.number || inputs.pr || github.event.client_payload.pr || github.event.merge_group.head_sha }}
  cancel-in-progress: true

env:
  CI_STATUS_MERGE_BACKEND: ${{ vars.MERGE_BACKEND || 'queue' }}
  IS_BATCH: ${{ github.event_name == 'merge_group' || (github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging') }}
  # Temporary escape hatch for `lake exe cache get`, kept only for an easy rollback
  # during the transition to the cache tool's new default read endpoint. Set the
  # variable to `1` to send cache reads back to the legacy storage endpoint. Clear it to
  # return reads to the default endpoint on the next run: the cache tool treats unset,
  # empty, `0`, and `false` alike as off.
  MATHLIB_CACHE_DEBUG_USE_LEGACY: ${{ vars.MATHLIB_CACHE_DEBUG_USE_LEGACY }}

jobs:
  # The existing picker applies class-specific preferences and shared build caps.
  # Merge groups and manual PR requests without an immutable head use cloud pools.
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    with:
      fleet-staging: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging' }}
      fleet-pr: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-pr-approved') }}
      pr-head: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha || '' }}
    permissions:
      actions: read
      contents: read  # immutable fleet selector checkout
    secrets:
      FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
      TAUCETI_GITHUB_STATE_TOKEN: ${{ secrets.TAUCETI_GITHUB_STATE_TOKEN }}

  # Name kept distinct from `build` on purpose — see the header note. The required merge check is the
  # `build` commit STATUS posted in the final step, not this job's auto-created check-run.
  sandboxed-build:
    needs: pick-runner
    if: ${{ !cancelled() }}
    # Exact fleet labels bind placement to one machine and guest. A failed picker
    # or failed-jobs-only rerun queues on GitHub: stale picker output must never
    # send another attempt to an ephemeral guest that has already retired.
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.attempt == format('{0}', github.run_attempt) && needs.pick-runner.outputs.runner || '"ubuntu-24.04"') }}
    outputs:
      status-sha: ${{ steps.pr.outputs.status_sha }}
      build-state: ${{ steps.report.outputs.build-state }}
      build-description: ${{ steps.report.outputs.build-description }}
      publication-required: ${{ steps.report.outputs.publication-required }}
      reported-toolchain: ${{ steps.cache_stage.outputs.toolchain }}
    env:
      BWRAP_VER: 0.9.0-1build1
      BWRAP_DEB_SHA256: dde30d1f24da50446d647ed504ec8dc5a714f171974d054c70a589b48ba38b48
      BWRAP_SHA256: 3e33f8255e1411ada346db27028c25ef5ba4fa3327754a2321ea4c8732a3bc10
      # Lake artifact-cache knobs, off by default. The "Configure the Lake artifact cache"
      # step flips these on (and sets LAKE_CACHE_DIR) ONLY when the public cache endpoints
      # are installed as repo variables; until then they stay empty and the build runs
      # exactly as before (a full recompile of TauCeti/). Declared here so the sandboxed
      # build's `--setenv` list always has a defined value to pass.
      LAKE_ARTIFACT_CACHE: ""
      LAKE_RESTORE_ARTIFACTS: ""
      LAKE_CACHE_DIR: ""
      # Enabled only for a merge-group commit when the upload service is configured. The
      # sandbox then stages the fully audited root-package outputs for the isolated publisher.
      STAGE_LAKE_CACHE: ""
    steps:
      # We expect the 262k default to be relevant at around 10m LOC, and this raised limit to be relevant at around 40m LOC.
      - name: Raise vm.max_map_count
        run: |
          target=1048576
          if [ "$(cat /proc/sys/vm/max_map_count)" -lt "$target" ]; then
            sudo -n sysctl -w vm.max_map_count="$target" >/dev/null 2>&1 \
              || sysctl -w vm.max_map_count="$target" >/dev/null 2>&1 || true
          fi
          now="$(cat /proc/sys/vm/max_map_count)"
          echo "vm.max_map_count=$now"
          [ "$now" -ge "$target" ] || echo "::warning::vm.max_map_count is $now, below $target"
      # --- Trusted setup: no PR code runs until the sandboxed build phase ---
      # This is the commit that supplied the pull_request_target / merge_group workflow. All
      # executable audit, watchdog, cache, and bump-validation tooling comes from here.
      - name: Checkout workflow-pinned trusted build tooling
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@a8b16c3dd0c0730a1963052cb520808e161222ef
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: a8b16c3dd0c0730a1963052cb520808e161222ef
          project-directory: gate
      - name: Select CI API credentials
        id: ci-api
        uses: TauCetiProject/TauCetiTools/.github/actions/ci-credentials@a8b16c3dd0c0730a1963052cb520808e161222ef
