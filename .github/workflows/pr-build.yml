name: pr-build
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging' && format('bors branch={0} batch={1} head={2} base={3}', github.event.client_payload.base_ref || 'unknown', github.event.client_payload.batch_id, github.event.client_payload.head_sha, github.event.client_payload.base_sha) || format('pr-build {0}', github.event.pull_request.number || inputs.pr || github.event.client_payload.pr || github.event.merge_group.head_sha || github.run_id) }}

# Keep this entrypoint and its bors run title stable: bors cancellation recovery
# binds failed statuses to this exact workflow path and candidate identity.
# The reusable workflow retains all sandbox, audit, publication and status gates.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The merge queue tests a batch (one or more PRs combined onto current main) before it lands. We
  # build the COMBINED merge-group commit exactly as GitHub synthesized it and post the `build`
  # status on it so the queue's required check is satisfied. A combined diff that reaches outside
  # TauCeti/ needs exact-revision human approval through bors; the trusted harness
  # remains independent of that diff.
  merge_group:
    types: [checks_requested]
  # Bors dispatches the exact staging SHA. repository_dispatch uses this trusted
  # default-branch workflow definition, not a candidate's .github/ files. A human
  # approval also requests ordinary PR CI; that dispatch carries no authority.
  repository_dispatch:
    types: [tauceti-bors-staging, tauceti-bors-pr-approved]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build", required: true, type: string }

permissions:
  contents: read
  statuses: write

concurrency:
  # Staging cancellation is owned by the validated reusable-workflow job below.
  # This outer group is run-specific until validation; all other keys are unchanged.
  group: pr-build-${{ github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging' && format('bors-staging-run-{0}', github.run_id) || github.event.pull_request.number || inputs.pr || github.event.client_payload.pr || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  staging-identity:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      group: ${{ steps.identity.outputs.group }}
    steps:
      - name: Checkout workflow-pinned identity validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/bors_staging_identity.py
          sparse-checkout-cone-mode: false
      - name: Validate staging identity
        id: identity
        run: python3 scripts/bors_staging_identity.py

  build-candidate:
    needs: staging-identity
    if: ${{ !cancelled() && ((github.event_name != 'repository_dispatch' || github.event.action != 'tauceti-bors-staging') || needs.staging-identity.result == 'success') }}
    # Reusable workflows cannot elevate the caller's token permissions. Permit
    # the existing runner picker's actions read here; pr-build-jobs.yml narrows
    # its build and publisher tokens to their original permissions.
    permissions:
      contents: read
      statuses: write
      actions: read
    # Concurrency on a reusable-workflow job cancels the whole build, publisher
    # and finalizer sequence. Invalid identities never reach a shared group.
    concurrency:
      group: ${{ needs.staging-identity.outputs.group || format('pr-build-jobs-run-{0}', github.run_id) }}
      cancel-in-progress: true
    uses: ./.github/workflows/pr-build-jobs.yml
    with:
      pr: ${{ inputs.pr || '' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
