name: pr-build
# retry-ci-status, fleet-recovery, review and pr-status match this name and these titles.
run-name: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'tauceti-bors-staging' || github.event.action == 'tauceti-bors-attested') && format('bors branch={0} batch={1} head={2} base={3}', github.event.client_payload.base_ref || 'unknown', github.event.client_payload.batch_id, github.event.client_payload.head_sha, github.event.client_payload.base_sha) || (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch' && github.event.action == 'tauceti-bors-pr-approved') && format('pr-build pr={0} head={1}', github.event.pull_request.number || github.event.client_payload.pr, github.event.pull_request.head.sha || github.event.client_payload.head_sha) || format('pr-build {0}', github.event.pull_request.number || inputs.pr || github.event.client_payload.pr || github.event.merge_group.head_sha || github.run_id) }}

# The build is TauCetiTools' pr-build.yml at main; this file keeps what GitHub reads from the
# repository where the event happens: triggers, the GITHUB_TOKEN ceiling, and secrets. See the
# callee for the build, scope and status policy. Its jobs appear as `pr-build / <job>`.
# The callee owns the workflow-level concurrency group; do not add one here with the same name.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The merge queue tests a batch (one or more PRs combined onto current main) before it lands. We
  # build the COMBINED merge-group commit exactly as GitHub synthesized it and post the `build`
  # status on it so the queue's required check is satisfied. A combined diff that reaches outside
  # TauCeti/ needs exact-revision human approval through bors; the trusted harness
  # remains independent of that diff.
  merge_group:
    types: [checks_requested]
  # Bors dispatches the exact staging SHA. repository_dispatch uses this trusted
  # default-branch workflow definition, not a candidate's .github/ files. A human
  # approval also requests ordinary PR CI; that dispatch carries no authority.
  repository_dispatch:
    # `tauceti-bors-attested`: the queue lands a batch its trusted repair worker already verified, without
    # rebuilding it (decision 200); the callee confirms the attestation with the queue first.
    types: [tauceti-bors-staging, tauceti-bors-attested, tauceti-bors-pr-approved]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build", required: true, type: string }
      maintenance: { description: "Prioritized maintenance recovery build", type: boolean, default: false }
      skip_build: { description: "Supersede an existing build after a self-tested label change", type: boolean, default: false }
      label_head: { description: "PR head observed by the CI label dispatcher", type: string, default: "" }

permissions:
  contents: read
  pull-requests: read  # workflow-pinned lint-policy GraphQL reads branches and labels
  statuses: write
  actions: read  # fence status publication against obsolete run attempts
  id-token: write  # telemetry-only OIDC audience, outside the candidate sandbox

jobs:
  pr-build:
    uses: TauCetiProject/TauCetiTools/.github/workflows/pr-build.yml@main
    with:
      pr: ${{ inputs.pr || '' }}
      maintenance: ${{ inputs.maintenance || false }}
      skip_build: ${{ inputs.skip_build || false }}
      label_head: ${{ inputs.label_head || '' }}
      tools_repository: TauCetiProject/TauCetiTools
      project_ref: ${{ github.workflow_sha }}
      lean_root: TauCeti
      roadmap_dir: TauCetiRoadmap
      fleet_routing: true
      fleet_pr_runner: '{"group":"TauCetiFleet","labels":["self-hosted","linux","x64","tauceti-fleet-pr"]}'
      control_runner: '["self-hosted","linux","x64","tauceti-fleet-queue-control","fleet-74773fc7f54d4877add11d80113fe340"]'
      staging_runner: '["self-hosted","linux","x64","tauceti-fleet-staging","fleet-74773fc7f54d4877add11d80113fe340"]'
      staging_pools: '["tauchonki2"]'
    secrets:
      FLEET_INVENTORY_APP_PRIVATE_KEY: ${{ secrets.FLEET_INVENTORY_APP_PRIVATE_KEY }}
      TAUCETI_GITHUB_STATE_TOKEN: ${{ secrets.TAUCETI_GITHUB_STATE_TOKEN }}
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}
