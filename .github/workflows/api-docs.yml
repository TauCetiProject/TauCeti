name: API docs

# Generate the API reference that pages.yml publishes under /docs, from the nested docbuild/
# project. The job is TauCetiTools' api-docs.yml at main, which documents how the incremental
# doc-gen4 build, its caches and the handoff to pages.yml work. This file keeps what GitHub reads
# from the repository where the event happens: triggers, concurrency and the GITHUB_TOKEN
# ceiling. Its job appears as `api-docs / build-docs`.
#
# The build runs on the TauCetiFleet runner group, which admits jobs by the file that defines
# them: TauCetiTools' api-docs.yml must be listed there. Set vars.PICKER_GITHUB_FALLBACK='true'
# to run it on ubuntu-24.04 instead.

on:
  push:
    branches: [main]
    paths:
      - 'docbuild/**'
      - '.github/workflows/api-docs.yml'
  schedule:
    - cron: "49 * * * *"   # Hourly (UTC); a run with nothing new to analyze takes a few minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref: a dispatch on another branch works on that branch's caches and must not hold up main's.
  group: api-docs-${{ github.ref }}
  # A run in progress holds the build cache it restored; let it save before the next one restores.
  cancel-in-progress: false

jobs:
  api-docs:
    uses: TauCetiProject/TauCetiTools/.github/workflows/api-docs.yml@main
    permissions:
      contents: read
      # Only for pruning this workflow's superseded cache entries, at the end of the job.
      actions: write
    with:
      lean_root: TauCeti
