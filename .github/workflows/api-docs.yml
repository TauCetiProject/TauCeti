name: API docs

# Generate the API reference that pages.yml publishes under /docs.
#
# The docs are generated by doc-gen4 from the nested docbuild/ project, which requires the real
# TauCeti library and shares the parent's Mathlib pin. With interproject linking
# (DOCGEN_LOCAL_MODULE_ROOTS / DOCGEN_DEPS_DOCS_URL, see the doc build step) doc-gen4 analyzes and
# renders only the TauCeti.* modules, and links references to Mathlib and Lean core out to the
# hosted mathlib4_docs.
#
# This workflow is separate from pages.yml so that site deploys never wait for the docs, and the
# docs never wait for the site. They meet in the actions cache: the finished tree is saved under
# `docs-html-v2-...`, and every Pages run restores the newest one.
#
# The build is incremental. doc-gen4 keeps its analysis in docbuild/.lake/build (a SQLite
# database plus one Lake marker per module), and that tree is cached between runs, so a run
# re-analyzes only the modules whose oleans changed since the last one. The cache is keyed on the
# pins, so a toolchain or Mathlib bump, which changes every olean anyway, starts from an empty
# database. Modules deleted from TauCeti are removed from the database by doc-gen4 itself.

on:
  push:
    branches: [main]
    paths:
      - 'docbuild/**'
      - '.github/workflows/api-docs.yml'
  schedule:
    - cron: "53 * * * *"   # Hourly (UTC); a run with nothing new to analyze takes a few minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref: a dispatch on another branch works on that branch's caches and must not hold up main's.
  group: api-docs-${{ github.ref }}
  # A run in progress holds the build cache it restored; let it save before the next one restores.
  cancel-in-progress: false

env:
  # Run JavaScript actions on Node 24 (Node 20 is deprecated on GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Temporary escape hatch for `lake exe cache get`; see the same variable in pages.yml.
  MATHLIB_CACHE_DEBUG_USE_LEGACY: ${{ vars.MATHLIB_CACHE_DEBUG_USE_LEGACY }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # A full rebuild (after a pin bump) analyzes all of TauCeti; everything else is far quicker.
    timeout-minutes: 300
    permissions:
      contents: read
      # Only for pruning this workflow's superseded cache entries, at the end of the job.
      actions: write
    defaults:
      run:
        working-directory: docbuild
    steps:
      # We expect the 262k default to be relevant at around 10m LOC, and this raised limit to be relevant at around 40m LOC.
      - name: Raise vm.max_map_count
        # the job's default working directory, docbuild/, does not exist before checkout
        working-directory: ${{ github.workspace }}
        run: |
          target=1048576
          if [ "$(cat /proc/sys/vm/max_map_count)" -lt "$target" ]; then
            sudo -n sysctl -w vm.max_map_count="$target" >/dev/null 2>&1 \
              || sysctl -w vm.max_map_count="$target" >/dev/null 2>&1 || true
          fi
          now="$(cat /proc/sys/vm/max_map_count)"
          echo "vm.max_map_count=$now"
          [ "$now" -ge "$target" ] || echo "::warning::vm.max_map_count is $now, below $target"

      - uses: actions/checkout@v4
        with:
          # This job elaborates nothing, but doc-gen4 loads TauCeti's environment, which runs
          # initializers; keep the token out of .git/config regardless. Full history, because
          # scripts/lake-cache-get.sh walks back from HEAD to the newest published revision.
          persist-credentials: false
          fetch-depth: 0

      # Pinned leanprover/elan release, verified by SHA-256; scripts/test_elan_pin.py keeps the
      # copies of the pin honest.
      - name: Install elan (pinned + checksum)
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The daily dependency updater advances the root Mathlib manifest independently of this
      # nested project. Copy its exact resolved pins into the nested manifest before computing the
      # cache keys. Do not use `lake update` here: TauCeti normally nominates Mathlib's moving
      # `master` branch, so an independent update could select a commit newer than main's lockfile.
      # Elan and Lake find the root toolchain by walking to the parent, but Mathlib's cache executable
      # reads `lean-toolchain` from its current directory. Give it a symlink, not another copy that
      # can drift.
      - name: Synchronize the docs dependencies with TauCeti
        run: |
          if [ -e lean-toolchain ] || [ -L lean-toolchain ]; then
            echo "::error title=Unexpected docs toolchain::docbuild/lean-toolchain must be generated as a link to the root toolchain"
            exit 1
          fi
          ln -s ../lean-toolchain lean-toolchain
          python3 sync_manifest.py

      # The previous run's doc-gen4 build directory (its database, its per-module markers, and the
      # rendered tree), for the same pins only: a different toolchain or Mathlib invalidates every
      # entry, so a prefix fallback across pins would restore nothing useful. The rendered tree has
      # to come along: some of its files (the bibliography) are written by steps whose markers
      # live outside it, so Lake would not recreate them if the tree alone were missing.
      - name: Restore the doc-gen4 build state
        uses: actions/cache/restore@v4
        with:
          path: docbuild/.lake/build
          key: docs-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docs-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-

      # doc-gen4 needs TauCeti's oleans. ci.yml publishes them, and ci.yml and pr-build.yml
      # already restore them. Restore into the root project rather than docbuild: a path
      # dependency builds in its own directory.
      - name: Configure the Lake artifact cache (no-op unless the public endpoints are set)
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          if [ -n "$PUBLIC_ARTIFACT_ENDPOINT" ] && [ -n "$PUBLIC_REVISION_ENDPOINT" ]; then
            {
              echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache"
              echo "LAKE_ARTIFACT_CACHE=true"
              echo "LAKE_RESTORE_ARTIFACTS=true"
              echo "TAUCETI_CACHE_ENABLED=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Lake artifact cache enabled - restoring TauCeti's oleans for the docs build"
          else
            echo "::notice::Lake artifact cache not configured - the docs build will compile TauCeti from scratch"
          fi

      - name: Restore TauCeti's oleans from the public artifact cache
        if: ${{ env.TAUCETI_CACHE_ENABLED == '1' }}
        # The job's default working directory is docbuild/; this script lives at the root.
        working-directory: ${{ github.workspace }}
        # A cache is an optimisation and must not be able to break the build. The script
        # already treats a miss as non-fatal and falls back to compiling from scratch;
        # this extends that to the script failing outright.
        continue-on-error: true
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: bash scripts/lake-cache-get.sh .

      - name: Fetch Mathlib oleans (docs project)
        run: lake exe cache get

      # The generated docbuild/lean-toolchain symlink resolves to TauCeti's root toolchain, so
      # there is no second independently pinned copy to drift. The pinned doc-gen4 source still
      # uses Lean internals, though, and may need updating after a Lean bump. Compile it on its own
      # first so an incompatibility fails in minutes rather than near the end of the full build.
      - name: Verify doc-gen4 is compatible with TauCeti's toolchain
        run: lake build doc-gen4

      # doc-gen4 documents a library's root modules and their closure; TauCeti's root is empty
      # by design, so we regenerate a throwaway aggregator root that imports the whole glob.
      - name: Generate the docs aggregator root
        run: python3 mk_docs_root.py

      # Analyze only the TauCeti.* modules and render pages for them; references to Mathlib (and
      # Lean core) link out to the hosted mathlib4_docs via its /find resolver. The analysis is
      # incremental (see the header), but every module page is rendered afresh, so pages for
      # deleted modules do not linger (the navigation bar lists whatever pages are on disk). That
      # means removing the module pages AND the marker that tells Lake the render is up to date;
      # removing only the pages would leave Lake skipping the render and produce none at all. The
      # previous run's provenance marker goes too, since the step after this one writes it anew.
      - name: Build the API documentation (doc-gen4)
        env:
          DOCGEN_LOCAL_MODULE_ROOTS: TauCeti
          DOCGEN_DEPS_DOCS_URL: https://leanprover-community.github.io/mathlib4_docs
          # The restore above placed what this needs, so do not reach for a remote cache.
          LAKE_NO_CACHE: "true"
        run: |
          rm -rf .lake/build/doc/TauCeti .lake/build/doc/SOURCE_SHA
          rm -f .lake/build/doc-data/*.docs_built
          lake build TauCetiDocs:docs

      # Stamp the tree with the commit it was generated from, BEFORE it is cached, so the
      # provenance travels with the tree wherever it is later restored. This is what makes the
      # `docgen` branch trustworthy: pages.yml's `advance-docgen-ref` follows the marker of the
      # tree that was actually deployed, rather than `github.sha` of whichever run deployed it.
      - name: Record the commit the API docs were generated from
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker=.lake/build/doc/SOURCE_SHA
          # The name must be ours alone. If doc-gen4 ever emits anything at that path, silently
          # overwriting it would corrupt the documentation, and trusting it would let a generated
          # file dictate where the docgen branch points.
          if [ -e "$marker" ] || [ -L "$marker" ]; then
            echo "::error title=SOURCE_SHA is taken::doc-gen4 produced an entry at $marker; the provenance marker needs another name"
            exit 1
          fi
          printf '%s\n' "$SHA" > "$marker"

      # pages.yml publishes the most recently SAVED tree, which is not necessarily the newest one:
      # re-running an old run of this workflow would save its older tree last, and the next Pages
      # run would publish it. So a run saves nothing once a later run has succeeded. Its build state
      # is older too, so that is skipped as well. If the question cannot be answered, save: that
      # is what every run did before this check existed.
      - name: Check that no later run has already succeeded
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          newest=$(gh run list -R "$REPO" --workflow api-docs.yml --branch "$REF_NAME" --status success \
            --limit 1 --json number --jq '.[0].number // 0' || echo 0)
          if [ "${newest:-0}" -gt "$RUN_NUMBER" ]; then
            echo "::warning title=Superseded::run #${newest} has already succeeded; not saving this older run's docs"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # What pages.yml restores (newest first, by prefix). The key shape is unchanged from when
      # pages.yml built the docs itself, so the entries it saved remain usable.
      - name: Save the generated API docs
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build/doc
          key: docs-html-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Saved only after a successful build: a failed build may have left the database half
      # updated, and the next run is better off restoring the last good state.
      - name: Save the doc-gen4 build state
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build
          key: docs-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Every run saves new entries, and the repository's cache is shared with the Mathlib olean
      # caches that pr-build.yml depends on, so left alone these would push those out under the
      # size limit. Only the newest few are ever restored; delete the rest. Best effort: a failure
      # here costs cache space, not the docs. Caches belong to the ref that saved them, and main's
      # are the ones Pages restores, so each ref prunes only its own.
      - name: Prune superseded cache entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for prefix in docs-build-v1- docs-html-v2-; do
            # Newest first; keep three so a Pages run that restored one just now still finds it.
            gh cache list -R "$REPO" --ref "$GITHUB_REF" --key "$prefix" --sort created_at --order desc --limit 100 --json id \
              --jq '.[3:][].id' |
              while read -r id; do
                gh cache delete -R "$REPO" "$id" || true
              done
          done
