# Adapted from Mathlib's comment-label workflow:
# https://github.com/leanprover-community/mathlib4/blob/master/.github/workflows/labels_from_comment.yml
# Any contributor may add/remove an allowlisted label with a standalone, unindented LABEL/-LABEL line.
# self-tested is a persistent PR-author declaration; pushes do not invalidate it.
# Only newly posted conversation comments count; editing/deleting a comment does not undo it.
# The last matching line for each label wins. Labels and matching are case-sensitive.
name: Labels from comments

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  label:
    # Reject ordinary comments before allocating a runner. A command is a whole line, so
    # admit only comments with an allowlisted label (or -label) at the start of some line.
    # Prepending a newline to the body turns "start of body" into "after a newline".
    # contains() is case-insensitive, so this is a superset of the exact parser below.
    # Automated AI review scoreboards are never commands, so they never allocate a runner.
    if: >-
      github.repository == 'TauCetiProject/TauCeti' &&
      !startsWith(github.event.comment.body, '<!--tauceti-scoreboard-->') && (
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}dont-repair-in-queue', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-dont-repair-in-queue', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}hold', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-hold', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}keep', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-keep', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}mathlib-overlap', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-mathlib-overlap', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}documentation', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-documentation', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}enhancement', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-enhancement', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}help wanted', fromJSON('"\n"'))) ||
        contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-help wanted', fromJSON('"\n"'))) ||
        (github.event.issue.pull_request != null &&
         github.event.comment.user.id == github.event.issue.user.id && (
          contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}self-tested', fromJSON('"\n"'))) ||
          contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}-self-tested', fromJSON('"\n"')))))
      )
    # Keep comment commands responsive when GitHub-hosted runners are backlogged.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout: neither PR code nor comment text is ever executed.
      - name: Read label commands
        id: commands
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const allowed = new Set([
              'dont-repair-in-queue',
              'hold',
              'keep',
              'mathlib-overlap',
              'documentation',
              'enhancement',
              'help wanted',
              'self-tested',
            ]);
            const commands = new Map();
            for (const raw of context.payload.comment.body.split(/\r?\n/)) {
              // Commands start at the line start, matching the job-level prefilter.
              const line = raw.trimEnd();
              const remove = line.startsWith('-');
              const label = remove ? line.slice(1) : line;
              if (allowed.has(label)) commands.set(label, !remove);
            }
            core.setOutput('labels', JSON.stringify([...commands]));

      # App-generated label events reach queue/status workflows and webhooks.
      # GITHUB_TOKEN would suppress follow-up Actions runs; the org also disables its writes.
      - name: Mint repository-scoped label token
        if: steps.commands.outputs.labels != '[]'
        id: token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write

      - name: Apply label commands
        if: steps.commands.outputs.labels != '[]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LABEL_COMMANDS: ${{ steps.commands.outputs.labels }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { owner, repo, number: issue_number } = context.issue;
            const comment = context.payload.comment;
            for (const [label, add] of JSON.parse(process.env.LABEL_COMMANDS)) {
              if (label === 'self-tested') {
                if (!context.payload.issue.pull_request) continue;
                const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
                if (comment.user.id !== pull.user.id) continue;
                if (add && pull.state !== 'open') continue;
                const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
                if (fresh.user.id !== comment.user.id || (add && fresh.state !== 'open')) continue;
              }
              if (add) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              } else {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
                } catch (error) {
                  // Removing a label that is already absent is a successful no-op.
                  if (error.status !== 404) throw error;
                }
              }
            }
