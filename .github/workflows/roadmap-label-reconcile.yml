name: Roadmap label

# One stateful batch handles every open PR whose classification inputs changed.
# Pending events coalesce globally; saved input hashes avoid replaying successes.
# The hourly backstop retries unfinished work after the final event of a burst.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full-scan:
        description: Reclassify every open PR (also use after roadmap changes)
        type: boolean
        default: false
      sync-labels:
        description: Maintain roadmap label colours and descriptions
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  reconcile:
    # Filter before concurrency: a title-only edit must not replace pending work.
    if: >-
      github.repository == 'TauCetiProject/TauCeti' && (
        (github.event_name == 'pull_request_target'
          && (github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null))
        || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'))
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=0
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 30
    concurrency:
      group: roadmap-label-batch
      cancel-in-progress: false
    environment:
      name: control-batch-debounce
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual dispatch must also execute only trusted default-branch code.
          ref: main
          persist-credentials: false

      - name: Prepare pinned shared tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@ad4e955b398d1419b0931e3c825a925f1c6a6e9b
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: ad4e955b398d1419b0931e3c825a925f1c6a6e9b
          project-directory: .
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiRoadmap
          path: roadmap
          persist-credentials: false

      # Discover artifacts rather than runs: cancelled pending jobs have no
      # checkpoint and must not crowd the last usable state out of the search.
      - name: Restore label progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trusted_run=$(cat scripts/control_batches/trusted-label-run.jq)
          ids=$(gh api "repos/$REPO/actions/artifacts?name=roadmap-label-state&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | .workflow_run.id')
          mkdir -p "$RUNNER_TEMP/roadmap-state-in"
          for id in $ids; do
            if ! trusted=$(gh api "repos/$REPO/actions/runs/$id" --jq "$trusted_run"); then
              echo "::warning::Could not verify one checkpoint producer; trying older progress"
              continue
            fi
            if [[ "$trusted" == true ]]; then
              if gh run download "$id" -R "$REPO" -n roadmap-label-state -D "$RUNNER_TEMP/roadmap-state-in"; then
                break
              fi
              rm -f "$RUNNER_TEMP/roadmap-state-in/state.json"
              echo "::warning::Could not download one checkpoint; trying older progress"
            fi
          done

      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-issues: write
          permission-pull-requests: write

      - name: Reconcile missed roadmap labels and structure nudges
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FULL_SCAN: ${{ inputs.full-scan && '1' || '' }}
          SYNC_LABELS: ${{ inputs.sync-labels && '1' || '' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$FULL_SCAN" == 1 ]]; then
            extra+=(--since 1970-01-01T00:00:00Z --retry-exhausted)
          fi
          if [[ "$SYNC_LABELS" == 1 ]]; then
            extra+=(--sync-labels)
          fi
          # Scale the listing guard with the repository, rather than introducing
          # a fixed open-PR count beyond which every batch would fail forever.
          owner=${REPO%/*}
          name=${REPO#*/}
          count=$(gh api graphql -F owner="$owner" -F name="$name" \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){pullRequests(states:OPEN){totalCount}}}' \
            --jq '.data.repository.pullRequests.totalCount')
          [[ "$count" =~ ^[0-9]+$ ]]
          limit=$((2 * count + 1))
          python3 scripts/control_batches/roadmap_batch.py \
            --repo "$REPO" --roadmap-dir roadmap --reconcile-open --limit "$limit" --max-wait 15 \
            --apply --structure-nudge \
            --state-in "$RUNNER_TEMP/roadmap-state-in/state.json" \
            --state-out "$RUNNER_TEMP/roadmap-state-out/state.json" "${extra[@]}"

      - name: Save recovery progress and retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-label-state
          path: ${{ runner.temp }}/roadmap-state-out/state.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
