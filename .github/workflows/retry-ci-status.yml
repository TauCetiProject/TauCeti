name: Retry CI status publication

# Recover only retained terminal reporting. This job never checks out a PR,
# rebuilds, or runs a workflow/script from the original run's candidate revision.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["pull_request_target","repository_dispatch","merge_group","workflow_dispatch"]'), github.event.workflow_run.event) &&
      (github.event.workflow_run.event != 'workflow_dispatch' || github.event.workflow_run.head_branch == github.event.repository.default_branch)
    concurrency:
      group: ci-status-retry-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=0
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 75
    env:
      CI_STATUS_MERGE_BACKEND: ${{ vars.MERGE_BACKEND || 'queue' }}
      CI_STATUS_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_STATUS_SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CI_STATUS_MAX_WAIT: '3700'
      TAUCETI_GITHUB_MAX_WAIT: '3700'
    steps:
      - name: Check out trusted default-branch reporting configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tauceti.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare pinned shared reporting tools
        uses: TauCetiProject/TauCetiTools/.github/actions/setup@a8b16c3dd0c0730a1963052cb520808e161222ef
        with:
          tools-repository: TauCetiProject/TauCetiTools
          tools-ref: a8b16c3dd0c0730a1963052cb520808e161222ef
