name: Retry CI status publication

# Replay retained terminal reporting on build completion. Scheduled sweeps also
# recover abandoned PRs through the ordinary trusted default-branch build.
#
# The jobs are TauCetiTools' retry-ci-status.yml at main; this file keeps what GitHub reads from
# the repository where the event happens: triggers, the GITHUB_TOKEN ceiling, and secrets. The
# queue dispatches this file by name with source_run_id and source_attempt. Its jobs appear as
# `publish / <job>`.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_run_id: {description: "Completed original build run whose retained statuses need delivery", type: string, default: ""}
      source_attempt: {description: "Original run attempt", type: string, default: "1"}

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

jobs:
  publish:
    uses: TauCetiProject/TauCetiTools/.github/workflows/retry-ci-status.yml@main
    with:
      project_ref: ${{ github.workflow_sha }}
      source_run_id: ${{ inputs.source_run_id || '' }}
      source_attempt: ${{ inputs.source_attempt }}
    secrets:
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}
