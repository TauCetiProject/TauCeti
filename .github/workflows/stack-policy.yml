name: No Stacked PRs

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Stack Policy Wake]
    types: [completed]
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number, or 0 for a bounded backlog sweep'
        type: number
        default: 0
      dry-run:
        description: 'Publish classifications without labels, comments or closure'
        type: boolean
        default: true

permissions:
  contents: read

# Serialize comment/close transactions so retries cannot duplicate comments.
# FIFO retains scheduled/manual backlog runs while PR events use focused checks.
# GitHub bounds this queue at 100; overflow cancellation is visible in Actions.
concurrency:
  group: tauceti-no-stacking
  cancel-in-progress: false
  queue: max

jobs:
  enforce:
    if: github.repository == 'TauCetiProject/TauCeti' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NO_STACK_APPLY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Even a dispatch selects only main-defined tooling. Candidate refs are
          # fetched later into a disposable bare source store and never executed.
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - name: Test trusted policy
        run: python3 scripts/test_stack_policy.py
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
      - name: Inspect current source and enforce confirmed stacks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STACK_ACTOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          REQUESTED_PR: ${{ inputs.pr || 0 }}
          APPLY_ENABLED: ${{ (vars.NO_STACK_APPLY == 'true' || (vars.NO_STACK_APPLY == 'dispatch' && github.event_name == 'workflow_dispatch' && inputs.pr > 0)) && (github.event_name != 'workflow_dispatch' || !inputs.dry-run) }}
        run: |
          args=()
          if [ "$APPLY_ENABLED" = true ]; then args+=(--apply); fi
          python3 scripts/stack_policy.py --github-event "$GITHUB_EVENT_PATH" \
            --pr "$REQUESTED_PR" --report stack-policy.jsonl "${args[@]}"
      - name: Publish audit
        if: always()
        run: |
          if [ -f stack-policy.jsonl ]; then
            cat stack-policy.jsonl
            {
              echo '### No-stacking source audit'
              echo '```jsonl'
              cat stack-policy.jsonl
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-policy-${{ github.run_id }}
          path: stack-policy.jsonl
          retention-days: 14
