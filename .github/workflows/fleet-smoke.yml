name: Fleet smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on:
      group: TauCetiFleet
      labels: [self-hosted, linux, x64, tauceti-fleet]
    timeout-minutes: 5
    steps:
      - name: Verify unprivileged guest execution
        run: |
          test "$(id -u)" -ne 0
          test -f /etc/os-release
          gh --version
          git --version
          jq --version
          sudo -n dpkg --version
          sudo -n apparmor_parser --version
          GH_TOKEN="${{ github.token }}" gh api repos/TauCetiProject/TauCeti --jq .full_name
          python3 -c 'import json,os; print(json.dumps(dict(cpus=os.cpu_count(), guest_user=os.getuid())))'
