name: Bounded cache transport investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-transport:
    timeout-minutes: 12
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cache-transport-probe.py
            /scripts/cache-probe-urls.json
      - name: Probe public cache transport with bounded anonymous reads
        run: |
          cp scripts/cache-probe-urls.json cache-probe-urls.json
          python3 scripts/cache-transport-probe.py
      - name: Retain diagnostic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-transport-investigation
          path: cache-probe-output/*.json
          retention-days: 7
