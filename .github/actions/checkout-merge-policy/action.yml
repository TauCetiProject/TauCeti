name: Checkout the merge policy
description: >-
  Check out TauCetiReview's runner (read-only) into .tauceti-review, at TauCetiReview main.
  Read-only readiness and reporting consumers use this policy.

# TauCeti reads the merge policy from TauCetiReview main, as it runs TauCetiTools main.
# The reusable review workflow in review.yml is the one exception: it requires an immutable
# review_ref, so it stays pinned to a commit. scripts/test_workflow_pins.py checks both.
#
# Production callers use a trusted checkout. The independent infrastructure tests also
# use this action from an unprivileged PR checkout, without secrets or write access.
# A sparse checkout must include .github/actions/checkout-merge-policy.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: TauCetiProject/TauCetiReview
        ref: main
        path: .tauceti-review
        sparse-checkout: runner
        persist-credentials: false
