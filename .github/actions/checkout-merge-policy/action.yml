name: Checkout the pinned merge policy
description: >-
  Check out TauCetiReview's runner (read-only) into .tauceti-review, at the same commit as the
  reusable review workflow. Read-only readiness and reporting consumers use this policy.

# This is the only place in TauCeti that names the policy commit outside the reusable workflow `uses:` lines,
# which GitHub requires to be literal. scripts/test_workflow_pins.py fails if the pins disagree.
# To re-pin, replace the SHA everywhere at once:
#   git grep -l <old-sha> | xargs sed -i 's/<old-sha>/<new-sha>/g'
#
# Production callers use a trusted checkout. The independent infrastructure tests also
# use this action from an unprivileged PR checkout, without secrets or write access.
# A sparse checkout must include .github/actions/checkout-merge-policy.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: TauCetiProject/TauCetiReview
        ref: 7fd3a39e02c5a16cf7be65508a7ffb2c336dcada
        path: .tauceti-review
        sparse-checkout: runner
        persist-credentials: false
